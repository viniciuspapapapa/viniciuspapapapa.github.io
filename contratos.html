<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honorários · TPC Advogados</title>
<meta name="description" content="Gestão de contratos de honorários: cronogramas, cobrança por e-mail com um clique, comissões de captação, verificação automática e prognóstico de receitas.">
<meta name="theme-color" content="#1B1B1B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%231B1B1B%27/%3E%3Crect x=%274%27 y=%274%27 width=%2724%27 height=%2724%27 fill=%27none%27 stroke=%27%23C8C3BE%27 stroke-width=%272%27/%3E%3Crect x=%279%27 y=%2720%27 width=%2714%27 height=%273%27 fill=%27%23F5EF90%27/%3E%3C/svg%3E">
<meta name="robots" content="noindex,nofollow">
<script>
(function(){try{var p=localStorage.getItem('hon_theme')||'light';var t=p==='system'?(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):p;document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* =========================================================
   TPC ADVOGADOS · Honorários
   Identidade: grafite, cinza quente da moldura do logotipo,
   amarelo-limão como marca-texto. Geometria reta, filetes finos.
   ========================================================= */
:root{
  --display:'Jost','Futura','Century Gothic',sans-serif;
  --font:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-xs:2px;--r-sm:4px;--r:6px;
  --sidebar-w:252px;
  --ease:cubic-bezier(.22,.8,.24,1);
  --t-fast:140ms;--t:220ms;
  --tpc-yellow:#F5EF90;--tpc-lime:#E8E347;--tpc-graphite:#3C3C3C;--tpc-frame:#C8C3BE;
  --side-bg:#1B1B1B;--side-text:#B9B5B1;--side-strong:#FFFFFF;--side-hover:rgba(255,255,255,.05);--side-border:#2C2C2C;
}
:root,[data-theme="light"]{
  --bg:#F3F1EC;--surface:#FFFFFF;--surface-2:#F8F6F2;--surface-3:#ECE9E3;
  --border:#E2DED7;--border-strong:#C8C3BE;
  --text:#1E1E1E;--text-2:#3C3C3C;--muted:#6A6662;
  --accent:#1E1E1E;--accent-hover:#000;--accent-soft:#FBF9D5;--on-accent:#FFFFFF;
  --mark:#F5EF90;--mark-strong:#E8E347;
  --link:#204696;
  --danger:#8B1A1A;--danger-soft:#F7E9E7;--on-danger:#FFFFFF;
  --warning:#7A5200;--warning-soft:#FBF3DC;
  --success:#2D5F2D;--success-soft:#E8F1E6;
  --info:#204696;--info-soft:#E8EDF7;
  --violet:#5B4A8B;--violet-soft:#EEEBF5;
  --c-recebido:#2B2B2B;--c-previsto:#A9A49E;--c-linha:#204696;--c-band:rgba(245,239,144,.45);--c-grid:#ECE9E3;
  --shadow:0 1px 0 rgba(30,30,30,.04),0 8px 24px -12px rgba(30,30,30,.12);
  --shadow-lg:0 30px 70px -20px rgba(20,20,20,.35);
  --scrim:rgba(20,20,20,.5);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#121212;--surface:#1A1A1A;--surface-2:#202020;--surface-3:#292929;
  --border:#2A2A2A;--border-strong:#3D3D3D;
  --text:#EDECEC;--text-2:#CECCCB;--muted:#9C9893;
  --accent:#F5EF90;--accent-hover:#FFF9A8;--accent-soft:#2A2916;--on-accent:#141414;
  --mark:#4A4719;--mark-strong:#F5EF90;
  --link:#9DB6EA;
  --danger:#F0948A;--danger-soft:#3A1E1B;--on-danger:#1A0E0D;
  --warning:#EBC06A;--warning-soft:#33290F;
  --success:#8CC98A;--success-soft:#18291A;
  --info:#9DB6EA;--info-soft:#1A2236;
  --violet:#B9A9E6;--violet-soft:#272235;
  --c-recebido:#EDECEC;--c-previsto:#6E6A66;--c-linha:#F5EF90;--c-band:rgba(245,239,144,.10);--c-grid:#262626;
  --shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lg:0 30px 80px -20px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.65);
  --side-bg:#0D0D0D;--side-border:#222;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--font);font-size:14.5px;line-height:1.55;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
a{color:var(--link);text-underline-offset:3px}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none!important}
::selection{background:var(--tpc-yellow);color:#1E1E1E}
.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.i-sm{width:15px;height:15px}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;box-shadow:0 0 0 5px var(--mark)}
.mono{font-family:var(--mono);font-size:.9em}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.num{font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
.right{text-align:right}
.t-danger{color:var(--danger)}.t-success{color:var(--success)}.t-warning{color:var(--warning)}
.view{animation:viewIn var(--t) var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stagger>*{animation:viewIn .32s var(--ease) both}
.stagger>*:nth-child(2){animation-delay:40ms}.stagger>*:nth-child(3){animation-delay:80ms}.stagger>*:nth-child(4){animation-delay:120ms}.stagger>*:nth-child(5){animation-delay:160ms}.stagger>*:nth-child(6){animation-delay:200ms}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);font-weight:600}
.skip:focus{left:8px}

/* ---------- moldura e navegação ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100dvh}
.sidebar{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;background:var(--side-bg);color:var(--side-text);padding:26px 14px 14px;overflow-y:auto;z-index:40;border-right:1px solid var(--side-border)}
.brand{display:block;padding:0 10px 4px;text-decoration:none}

.brand-sub{display:flex;align-items:center;gap:8px;margin:14px 10px 18px;font:500 11px/1 var(--display);letter-spacing:.24em;text-transform:uppercase;color:#8E8A86}
.brand-sub::before{content:"";width:18px;height:2px;background:var(--tpc-yellow)}
.cmdk{display:flex;align-items:center;gap:10px;margin:0 2px 14px;padding:9px 12px;border-radius:var(--r-sm);border:1px solid #333;background:#232323;color:#9C9893;font-size:13px;width:calc(100% - 4px);text-align:left;transition:border-color var(--t-fast),color var(--t-fast)}
.cmdk:hover{border-color:#555;color:#fff}
.cmdk kbd{margin-left:auto;font:600 10.5px var(--font);border:1px solid #444;border-radius:3px;padding:1px 5px;color:#B9B5B1}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-section{font:500 10.5px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;color:#77736F;padding:20px 12px 8px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;min-height:40px;padding:8px 12px;border-radius:var(--r-sm);color:var(--side-text);font-size:14px;font-weight:500;border:0;background:none;width:100%;text-align:left;text-decoration:none;transition:background var(--t-fast),color var(--t-fast)}
.nav-item:hover{background:var(--side-hover);color:#fff}
.nav-item.active{color:var(--side-strong);background:rgba(255,255,255,.06)}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:var(--tpc-yellow)}
.nav-item.active .i{color:var(--tpc-yellow)}
.count{margin-left:auto;font-size:11px;font-weight:700;min-width:22px;height:20px;padding:0 7px;border-radius:var(--r-xs);display:inline-grid;place-items:center;background:var(--surface-3);color:var(--text-2);font-variant-numeric:tabular-nums}
.sidebar .count{background:#2C2C2C;color:#CECCCB}
.count.alert,.sidebar .count.alert{background:var(--tpc-yellow);color:#1E1E1E}
.count:empty{display:none}
.sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--side-border);display:flex;flex-direction:column;gap:1px}
.save-state{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#77736F;padding:8px 12px 2px}
.save-state.err{color:#F0948A}
.main-wrap{min-width:0}
.topbar{display:none}
.main{padding:40px 44px 80px;max-width:1400px;margin:0 auto}
.scrim{display:none}

/* ---------- cabeçalho de página ---------- */
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:30px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 11px/1 var(--display);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.eyebrow::before{content:"";width:22px;height:2px;background:var(--mark-strong)}
.page-h h1{font-family:var(--display);font-size:34px;font-weight:400;line-height:1.1;letter-spacing:.01em}
.page-h .sub{color:var(--muted);font-size:14px;margin-top:8px;max-width:72ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:14px}
.back:hover{color:var(--text)}

/* ---------- botões ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:13.5px;font-weight:600;white-space:nowrap;text-decoration:none;transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast),box-shadow var(--t-fast)}
.btn:hover{border-color:var(--text-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);box-shadow:inset 0 -3px 0 var(--tpc-yellow)}
[data-theme="dark"] .btn.primary:hover{box-shadow:none}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--on-danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{min-height:32px;padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:var(--r-sm);border:0;background:none;color:var(--muted);transition:background var(--t-fast),color var(--t-fast)}
.icon-btn:hover{background:var(--surface-3);color:var(--text)}

/* ---------- superfícies ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;min-width:0;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.card-h h2,.card-h h3{font-family:var(--display);font-size:17px;font-weight:500;letter-spacing:.01em}
.card-h .hint{margin-top:3px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}

/* indicadores em faixa editorial */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden}
.kpi{position:relative;padding:20px 22px 18px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);margin:0 -1px -1px 0;text-align:left;background:none;border-top:0;border-left:0;color:inherit;font:inherit;transition:background var(--t-fast)}
button.kpi:hover,a.kpi:hover{background:var(--surface-2)}
a.kpi{text-decoration:none}
.kpi .lbl{font:500 10.5px/1.3 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--display);font-size:27px;font-weight:400;margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.005em;line-height:1.1;white-space:nowrap}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.kpi.hl .val{background:linear-gradient(transparent 62%,var(--mark) 62%);display:inline;padding:0 2px}
.kpi.danger .val{color:var(--danger)}.kpi.success .val{color:var(--success)}
.kpi .spark{display:block;margin-top:10px;width:100%;height:28px}
.kpi .spark path{fill:none;stroke:var(--text-2);stroke-width:1.4}
.kpi .spark .area{fill:var(--mark);stroke:none;opacity:.7}
.kpi .spark circle{fill:var(--text)}
.kpi .go{position:absolute;right:14px;top:16px;color:var(--muted);opacity:0;transition:opacity var(--t-fast),transform var(--t-fast)}
button.kpi:hover .go,a.kpi:hover .go{opacity:1;transform:translateX(2px)}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:var(--r-xs);white-space:nowrap;background:var(--surface-3);color:var(--text-2);letter-spacing:.01em}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.ok{background:var(--success-soft);color:var(--success)}
.chip.warn{background:var(--warning-soft);color:var(--warning)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}

/* tabelas */
.table-wrap{overflow-x:auto;margin:0 -24px;padding:0 24px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font:500 10.5px/1.2 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 10px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr{transition:background var(--t-fast)}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--border-strong);font-variant-numeric:tabular-nums}
.tbl .acts{white-space:nowrap;text-align:right}
.tbl input[type=checkbox]{width:16px;height:16px;accent-color:var(--text)}
.cell-main{font-weight:600;color:var(--text)}
a.cell-main{text-decoration:none}a.cell-main:hover{text-decoration:underline;text-decoration-color:var(--mark-strong);text-decoration-thickness:2px}
.cell-sub{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1 1 240px;max-width:400px}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--border)}
.tab{position:relative;border:0;background:none;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--muted);transition:color var(--t-fast)}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text)}
.tab.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;background:var(--mark-strong)}
.tab .count{margin-left:6px}
.empty{padding:44px 16px;color:var(--muted);text-align:left;max-width:560px}
.empty h3{color:var(--text);font-family:var(--display);font-weight:500;font-size:20px;margin-bottom:8px}

/* barras horizontais interativas */
.bars{display:flex;flex-direction:column;gap:4px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px;padding:6px 8px;margin:0 -8px;border-radius:var(--r-sm);border:0;background:none;width:calc(100% + 16px);text-align:left;color:inherit}
button.bar-row{cursor:pointer;transition:background var(--t-fast)}
button.bar-row:hover{background:var(--surface-2)}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2)}
.bar{height:8px;border-radius:0;background:var(--surface-3);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--text-2);transform-origin:left;animation:grow .6s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.progress{height:4px;background:var(--surface-3);overflow:hidden;margin-top:12px}
.progress>span{display:block;height:100%;background:var(--mark-strong);transform-origin:left;animation:grow .7s var(--ease) both}
[data-theme="light"] .progress>span{background:var(--text-2)}
.chart-box{position:relative;height:310px}
.chart-legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lg{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 10px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:opacity var(--t-fast),border-color var(--t-fast)}
.lg:hover{border-color:var(--border-strong)}
.lg.off{opacity:.45;text-decoration:line-through}
.lg i{width:10px;height:10px;display:inline-block}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border-strong)}
.seg button.on{background:var(--text);color:var(--bg)}
.dl{display:grid;grid-template-columns:minmax(100px,max-content) minmax(0,1fr);gap:9px 18px;font-size:13.5px}
.dl dt{color:var(--muted);font-size:12.5px;padding-top:1px}
.dl dd{margin:0;overflow-wrap:anywhere}
.alert-list{display:flex;flex-direction:column;gap:6px}
.alert-item{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-left:3px solid var(--border-strong);background:var(--surface-2);font-size:13.5px}
.alert-item:has(.dot.erro){border-left-color:var(--danger)}
.alert-item:has(.dot.aviso){border-left-color:var(--warning)}
.alert-item:has(.dot.info){border-left-color:var(--info)}
.alert-item .dot{display:none}
.timeline{display:flex;flex-direction:column;font-size:13px;border-left:1px solid var(--border-strong);margin-left:4px}
.timeline div{display:flex;gap:12px;padding:5px 0 5px 14px;position:relative}
.timeline div::before{content:"";position:absolute;left:-4px;top:12px;width:7px;height:7px;background:var(--surface);border:1px solid var(--text-2);border-radius:50%}
.timeline time{color:var(--muted);min-width:118px;font-variant-numeric:tabular-nums}
.notice{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-left:3px solid var(--info);background:var(--info-soft);color:var(--text);font-size:13.5px;margin-bottom:18px;border-radius:0 var(--r-sm) var(--r-sm) 0}
.notice.warn{border-left-color:var(--mark-strong);background:var(--accent-soft)}
.notice.danger{border-left-color:var(--danger);background:var(--danger-soft)}
.notice .i{margin-top:1px;flex:none}
.pre{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:14px 16px;font-size:13px;max-height:360px;overflow:auto}
.code{font-family:var(--mono);font-size:12px;white-space:pre;overflow:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;max-height:300px}
.drop{border:1px dashed var(--border-strong);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted);transition:border-color var(--t-fast),background var(--t-fast)}
.drop.over{border-color:var(--text);background:var(--accent-soft)}
.step{font:500 11px/1 var(--display);letter-spacing:.2em;color:var(--muted);margin-bottom:8px}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl-s{font-size:12px;font-weight:600;color:var(--text-2);letter-spacing:.01em}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=password],input[type=url],input[type=search],select,textarea{width:100%;min-height:40px;padding:8px 12px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);font-size:14px;transition:border-color var(--t-fast),box-shadow var(--t-fast)}
textarea{min-height:84px;resize:vertical;line-height:1.5}
input:hover,select:hover,textarea:hover{border-color:var(--text-2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--text);box-shadow:0 0 0 3px var(--mark)}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
.form-grid .span2{grid-column:span 2}
.form-grid .span3{grid-column:1/-1}
.fs{border:0;border-top:1px solid var(--border);padding:18px 0 4px;margin:0 0 10px}
.fs>legend{font:500 11px/1 var(--display);letter-spacing:.22em;text-transform:uppercase;padding:0 12px 0 0;color:var(--text)}
.check{display:flex;align-items:center;gap:9px;font-size:13.5px}
.check input{width:16px;height:16px;accent-color:var(--text)}
.cron-tbl input{min-height:34px;padding:4px 8px;font-size:13px}
.cron-sum{display:flex;gap:16px;flex-wrap:wrap;justify-content:flex-end;font-size:13px;margin-top:10px}

/* modal e paleta de comandos */
.modal-scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:80;overflow-y:auto;animation:fade var(--t) var(--ease);backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);width:min(640px,100%);display:flex;flex-direction:column;border-top:3px solid var(--tpc-yellow);animation:pop .26s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.modal.wide{width:min(1060px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;border-bottom:1px solid var(--border)}
.modal-h h2{font-family:var(--display);font-size:20px;font-weight:500}
.modal-b{padding:20px 24px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--border);flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-radius:0 0 var(--r) var(--r)}
.palette{position:fixed;inset:0;z-index:95;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;animation:fade var(--t-fast) var(--ease)}
.palette-box{width:min(620px,100%);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden;border-top:3px solid var(--tpc-yellow);animation:pop .2s var(--ease)}
.palette-box input{border:0;border-bottom:1px solid var(--border);border-radius:0;min-height:56px;font-size:16px;padding:0 20px;box-shadow:none!important}
.palette-list{max-height:min(420px,60vh);overflow-y:auto;padding:6px}
.palette-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:0;background:none;text-align:left;border-radius:var(--r-sm);font-size:14px;color:var(--text)}
.palette-item small{margin-left:auto;color:var(--muted);font-size:12px}
.palette-item.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--mark-strong)}
.palette-group{font:500 10.5px/1 var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:12px 14px 6px}
.toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:calc(100vw - 40px)}
.toast{background:#1E1E1E;color:#F3F1EC;padding:12px 16px 12px 14px;border-radius:var(--r-sm);box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:500;border-left:3px solid var(--tpc-yellow);animation:pop .22s var(--ease);max-width:440px}
.toast.err{border-left-color:#F0948A}
.toast.ok{border-left-color:#8CC98A}

/* bloqueio */
.lock-screen{position:fixed;inset:0;display:grid;place-items:center;background:#141414;z-index:120;padding:16px}
.lock-card{width:min(400px,100%);color:#EDECEC}

.lock-card h1{font-family:var(--display);font-weight:400;font-size:26px;margin-bottom:6px}
.lock-card .hint{color:#9C9893}
.lock-card input{background:#1E1E1E;border-color:#3D3D3D;color:#EDECEC}
.lock-card .btn.primary{background:var(--tpc-yellow);border-color:var(--tpc-yellow);color:#141414}


.logo{display:block;height:auto;color:#F3F1EC}
.brand .logo{width:196px}
.lock-card .logo{width:240px;margin-bottom:36px}
#main:focus,#main:focus-visible{outline:none;box-shadow:none}
.btn.primary .count{background:var(--on-accent);color:var(--accent)}
.kpi .val{font-size:clamp(19px,1.9vw,27px)!important}
.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (min-width:1560px){.kpis.k6{grid-template-columns:repeat(6,minmax(0,1fr))}}
.search input[type=search]{padding-left:38px}
.bar-row.wide{grid-template-columns:minmax(0,1fr) auto minmax(110px,auto)}
@media (max-width:1180px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-2-1{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);transform:translateX(-100%);transition:transform var(--t) var(--ease);box-shadow:var(--shadow-lg)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:30}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20;background:var(--side-bg);color:#EDECEC;padding:10px 12px;border-bottom:2px solid var(--tpc-yellow)}
  .topbar .icon-btn{color:#EDECEC}
  .topbar .logo{width:122px}
  .topbar .t{margin-left:auto;font:500 11px var(--display);letter-spacing:.2em;text-transform:uppercase;color:#B9B5B1}
  .main{padding:24px 16px 64px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page-h h1{font-size:27px}
}
@media (max-width:560px){
  .kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr))}
  body{font-size:15px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .form-grid .span2{grid-column:auto}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{padding:16px}
  .kpi .val{font-size:20px}
  .bar-row{grid-template-columns:minmax(0,96px) minmax(0,1fr) auto}
  .modal-scrim{padding:0}
  .modal{border-radius:0;min-height:100dvh}
  .table-wrap{margin:0 -16px;padding:0 16px}
  .card{padding:18px 16px}
  .toasts{left:16px;right:16px;bottom:16px}
  input,select,textarea{font-size:16px!important}
}
@media print{.sidebar,.topbar,.actions,.toolbar{display:none!important}.app{display:block}}
</style>
