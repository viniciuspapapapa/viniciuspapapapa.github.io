<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff4e6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Fatia</title>
<meta name="description" content="Fatia: corte as formas no ar na proporção exata. Metade, um terço, um quarto. Quanto mais preciso, mais pontos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1b3d;--mute:#8b7a9c;--acc:#ff4f7b;--bg:#fff4e6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;position:fixed;inset:0;width:100%;overscroll-behavior:none}
canvas{position:fixed;inset:0;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;pointer-events:none;z-index:2}
#lives{font-size:22px;letter-spacing:2px}
#score{font-size:42px;font-weight:700;line-height:1;text-align:center}
#mult{text-align:right;font-weight:700;font-size:18px;color:var(--acc)}
#wave{font-size:12px;color:var(--mute);text-align:center;font-weight:600;letter-spacing:.1em;margin-top:2px}
.ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 20px);text-align:center;background:rgba(255,244,230,.88);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.logo{font-size:clamp(64px,22vw,118px);font-weight:700;line-height:.95;color:var(--ink);position:relative}
.logo span{display:inline-block}
.logo .a{color:#ff4f7b;transform:translate(-2px,-6px) rotate(-6deg)}
.logo .b{color:#2a1b3d;transform:translate(2px,6px) rotate(4deg)}
.tag{color:var(--mute);font-size:16px;font-weight:500;margin-top:10px;max-width:320px;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 26px;border-radius:999px;font-weight:700;font-size:19px;background:#fff;border:2px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.main{background:var(--acc);color:#fff;min-width:220px}
.gap{height:18px}
.big{font-size:84px;font-weight:700;line-height:1}
.lbl{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.rec{display:inline-block;margin-top:10px;padding:6px 16px;border-radius:999px;background:#2a1b3d;color:#ffd84f;font-weight:700;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:340px}
.st{background:#fff;border:2px solid #f0e0d0;border-radius:16px;padding:10px 4px}
.st b{display:block;font-size:22px}
.st span{font-size:11px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.back{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;z-index:6;font-size:13px;font-weight:600;color:var(--mute);text-decoration:none;padding:8px 12px;border-radius:12px;background:rgba(0,0,0,.05)}
.help{color:var(--mute);font-size:14.5px;line-height:1.5;max-width:330px;font-weight:500}
.help b{color:var(--acc)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><div id="lives">❤❤❤</div><div><div id="score">0</div><div id="wave">ONDA 1</div></div><div id="mult"></div></div>

<div class="ov" id="menu">
  <a class="back" href="jogos.html">← Jogos</a>
  <div class="logo"><span class="a">FA</span><span class="b">TIA</span></div>
  <div class="tag">Corte no ar. Na medida exata.</div>
  <div class="gap"></div>
  <button class="btn main" id="play">✂ Jogar</button>
  <div class="gap"></div>
  <div class="help"><b>Arraste</b> uma linha reta sobre as formas que voam. Cada uma pede uma proporção: <b>½</b>, <b>⅓</b> ou <b>¼</b>. Quanto mais exato o corte, mais pontos. Errar feio ou deixar cair custa um coração. E nunca corte as <b>minas</b>.</div>
  <div class="gap"></div>
  <div class="lbl" id="mBest"></div>
</div>

<div class="ov hidden" id="over">
  <div class="lbl">Fim de jogo</div>
  <div class="big" id="oScore">0</div>
  <div id="oRec"></div>
  <div class="gap"></div>
  <div class="stats"><div class="st"><b id="oPerf">0</b><span>Perfeitos</span></div><div class="st"><b id="oAvg">0</b><span>Erro médio</span></div><div class="st"><b id="oWave">1</b><span>Onda</span></div></div>
  <div class="gap"></div>
  <button class="btn main" id="again">↻ De novo</button>
  <div class="gap" style="height:12px"></div>
  <button class="btn" id="toMenu">Menu</button>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),randi=(a,b)=>Math.floor(rand(a,b+1)),clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[Math.floor(Math.random()*a.length)];
const cv=$('#c'),ctx=cv.getContext('2d');let W,H,DPR,S;
const KEY='fatia_v1';
let store=Object.assign({best:0,games:0,perfects:0},(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})());
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const AU={ac:null,
  init(){if(this.ac){if(this.ac.state==='suspended')this.ac.resume();return;}const A=window.AudioContext||window.webkitAudioContext;if(!A)return;this.ac=new A();this.m=this.ac.createGain();this.m.gain.value=.6;this.m.connect(this.ac.destination);const n=this.ac.sampleRate;this.nb=this.ac.createBuffer(1,n,n);const d=this.nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;},
  tone(f,d=.2,type='sine',v=.15,delay=0,f2=null){if(!this.ac)return;const t=this.ac.currentTime+delay,o=this.ac.createOscillator(),g=this.ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+.05);},
  noise(d=.3,type='lowpass',f=800,v=.2,f2=null){if(!this.ac)return;const t=this.ac.currentTime,s=this.ac.createBufferSource();s.buffer=this.nb;const fl=this.ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);const g=this.ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(this.m);s.start(t);s.stop(t+d+.05);}
};
const sfx={
  slice(){AU.noise(.18,'highpass',2500,.18,8000);},
  grade(g,c){const base={PERFEITO:784,'ÓTIMO':659,BOM:523,QUASE:392}[g]||330;const f=base*Math.pow(2,Math.min(c,12)/24);AU.tone(f,.3,'triangle',.14);AU.tone(f*1.5,.35,'sine',.06,.05);if(g==='PERFEITO'){AU.tone(f*2,.5,'sine',.07,.1);}},
  miss(){AU.tone(220,.3,'square',.06,0,110);},
  boom(){AU.noise(.8,'lowpass',1400,.45,60);AU.tone(80,.6,'sine',.3,0,30);},
  throw(){AU.noise(.12,'bandpass',500,.05,900);},
  over(){[523,440,349,262].forEach((f,i)=>AU.tone(f,.4,'triangle',.1,i*.12));}
};
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';S=Math.min(W,H*.62)/390;}
addEventListener('resize',resize);

// ---------- geometria
function area(p){let a=0;for(let i=0;i<p.length;i++){const[x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length];a+=x1*y2-x2*y1;}return a/2;}
function centroid(p){let a=0,cx=0,cy=0;for(let i=0;i<p.length;i++){const[x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length];const f=x1*y2-x2*y1;a+=f;cx+=(x1+x2)*f;cy+=(y1+y2)*f;}if(Math.abs(a)<1e-6){let sx=0,sy=0;for(const[x,y]of p){sx+=x;sy+=y;}return[sx/p.length,sy/p.length];}return[cx/(3*a),cy/(3*a)];}
function clip(poly,A,B,sign){const out=[];const side=p=>((B[0]-A[0])*(p[1]-A[1])-(B[1]-A[1])*(p[0]-A[0]))*sign;
  for(let i=0;i<poly.length;i++){const P=poly[i],Q=poly[(i+1)%poly.length];const sp=side(P),sq=side(Q);if(sp>=0)out.push(P);if((sp>=0)!==(sq>=0)){const t=sp/(sp-sq);out.push([P[0]+(Q[0]-P[0])*t,P[1]+(Q[1]-P[1])*t]);}}return out;}
function segInt(p1,p2,p3,p4){const d=(p2[0]-p1[0])*(p4[1]-p3[1])-(p2[1]-p1[1])*(p4[0]-p3[0]);if(Math.abs(d)<1e-9)return false;const t=((p3[0]-p1[0])*(p4[1]-p3[1])-(p3[1]-p1[1])*(p4[0]-p3[0]))/d;const v=((p3[0]-p1[0])*(p2[1]-p1[1])-(p3[1]-p1[1])*(p2[0]-p1[0]))/d;return t>=0&&t<=1&&v>=0&&v<=1;}
function inside(pt,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if((yi>pt[1])!==(yj>pt[1])&&pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)c=!c;}return c;}
function norm(pts){const c=centroid(pts);let m=0;const o=pts.map(([x,y])=>{const q=[x-c[0],y-c[1]];m=Math.max(m,Math.hypot(q[0],q[1]));return q;});return o.map(([x,y])=>[x/m,y/m]);}
const SHAPES={
  tri:()=>reg(3),quad:()=>{const a=rand(.55,1);return[[-1,-a],[1,-a],[1,a],[-1,a]];},pent:()=>reg(5),hex:()=>reg(6),
  star:()=>{const k=randi(5,6),p=[];for(let i=0;i<k*2;i++){const a=-Math.PI/2+i*Math.PI/k,r=i%2?.48:1;p.push([Math.cos(a)*r,Math.sin(a)*r]);}return p;},
  blob:()=>{const n=14,p=[],ph=rand(0,TAU),ph2=rand(0,TAU);for(let i=0;i<n;i++){const a=i/n*TAU;const r=1+.18*Math.sin(2*a+ph)+.1*Math.sin(3*a+ph2);p.push([Math.cos(a)*r,Math.sin(a)*r]);}return p;},
  L:()=>[[-.8,-1],[-.1,-1],[-.1,.3],[.8,.3],[.8,1],[-.8,1]],
  T:()=>[[-1,-1],[1,-1],[1,-.4],[.3,-.4],[.3,1],[-.3,1],[-.3,-.4],[-1,-.4]],
  cruz:()=>[[-.3,-1],[.3,-1],[.3,-.3],[1,-.3],[1,.3],[.3,.3],[.3,1],[-.3,1],[-.3,.3],[-1,.3],[-1,-.3],[-.3,-.3]],
  seta:()=>[[-1,-.35],[.15,-.35],[.15,-.85],[1,0],[.15,.85],[.15,.35],[-1,.35]],
  casa:()=>[[-.8,1],[-.8,-.1],[0,-1],[.8,-.1],[.8,1]],
  coracao:()=>{const p=[];for(let i=0;i<36;i++){const t=i/36*TAU;p.push([16*Math.pow(Math.sin(t),3)/16,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16]);}return p;},
  trapezio:()=>{const t=rand(.25,.6);return[[-t,-.8],[t,-.8],[1,.8],[-1,.8]];},
  losango:()=>[[0,-1],[.6,0],[0,1],[-.6,0]]
};
function reg(n){const p=[],o=rand(0,TAU);for(let i=0;i<n;i++){const a=o+i/n*TAU;p.push([Math.cos(a),Math.sin(a)]);}return p;}
const PAL=['#ff4f7b','#ffb627','#2ec4b6','#7b5cff','#ff7a3d','#3a86ff','#8ac926','#ff5ea8','#00b4d8'];
const TGT={50:'½',33:'⅓',25:'¼'};

// ---------- estado
let state='menu',G=null,T=0;
function newGame(){
  G={score:0,lives:3,wave:0,combo:0,shapes:[],pieces:[],parts:[],texts:[],perfects:0,errs:[],ts:1,slowT:0,flash:0,shake:0,waveT:.6,best:false};
  state='play';$('#menu').classList.add('hidden');$('#over').classList.add('hidden');$('#hud').classList.remove('hidden');hud();
}
function hud(){$('#lives').textContent='❤'.repeat(Math.max(0,G.lives))+'♡'.repeat(Math.max(0,3-G.lives));$('#score').textContent=G.score;$('#wave').textContent='ONDA '+Math.max(1,G.wave);const m=mult();$('#mult').textContent=m>1?'×'+m:'';}
function mult(){return Math.min(5,1+Math.floor(G.combo/2));}
function spawnWave(){
  G.wave++;const w=G.wave;
  let n=w<3?1:w<7?randi(1,2):w<12?randi(2,3):randi(2,4);
  const keys=Object.keys(SHAPES);const easy=['tri','quad','pent','hex','blob'];
  const g=H*clamp(.5+.035*w,.5,1.15);
  for(let i=0;i<n;i++){
    const k=w<3?pick(easy):pick(keys);
    let tgt=50;if(w>=4){tgt=pick(w<8?[50,50,33]:[50,33,25,25]);}
    const mine=w>=6&&i>0&&Math.random()<.35;
    const r=(mine?.62:1)*rand(62,78)*S;
    const x0=rand(W*.2,W*.8),y0=H+r+10;const apex=rand(H*.22,H*.42);const vy=-Math.sqrt(2*g*(y0-apex));
    const vx=(W/2-x0)*rand(.15,.45)*g/Math.abs(vy)/1.4;
    G.shapes.push({pts:mine?spiky():norm(SHAPES[k]()),x:x0,y:y0,vx,vy,g,r,rot:rand(0,TAU),vr:rand(-1,1)*Math.min(2.4,.2+.16*w),col:mine?'#2a1b3d':pick(PAL),tgt,mine,delay:i*rand(.25,.55),alive:true});
  }
  sfx.throw();
}
function spiky(){const p=[];for(let i=0;i<16;i++){const a=i/16*TAU,r=i%2?.62:1;p.push([Math.cos(a)*r,Math.sin(a)*r]);}return p;}
function world(s){const c=Math.cos(s.rot),sn=Math.sin(s.rot);return s.pts.map(([x,y])=>[s.x+(x*c-y*sn)*s.r,s.y+(x*sn+y*c)*s.r]);}
function text(x,y,s,c,sz=26,life=1.1){G.texts.push({x,y,s,c,sz,life,max:life});}
function burst(x,y,n,c,sp=300,sz=4){for(let i=0;i<n;i++){const a=rand(0,TAU),v=rand(.2,1)*sp*S;G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.4,.9),max:.9,c,sz:sz*rand(.6,1.3)});}}
function loseLife(x,y,msg){G.lives--;G.combo=0;G.shake=12;vib([50,30,50]);sfx.miss();text(x,y,msg,'#2a1b3d',24);hud();if(G.lives<=0)gameOver();}
function cut(A,B){
  if(Math.hypot(B[0]-A[0],B[1]-A[1])<30)return;
  let any=false;
  for(const s of G.shapes){
    if(!s.alive||s.delay>0)continue;
    const wp=world(s);let hits=0;for(let i=0;i<wp.length;i++)if(segInt(A,B,wp[i],wp[(i+1)%wp.length]))hits++;
    if(hits<1&&!inside(A,wp)&&!inside(B,wp))continue;
    const p1=clip(wp,A,B,1),p2=clip(wp,A,B,-1);if(p1.length<3||p2.length<3)continue;
    const a1=Math.abs(area(p1)),a2=Math.abs(area(p2)),tot=a1+a2;if(a1<1||a2<1)continue;
    any=true;s.alive=false;
    const nx=-(B[1]-A[1]),ny=B[0]-A[0],nl=Math.hypot(nx,ny);
    [[p1,1,a1],[p2,-1,a2]].forEach(([poly,sg,ar])=>{const c=centroid(poly);G.pieces.push({pts:poly.map(([x,y])=>[x-c[0],y-c[1]]),x:c[0],y:c[1],vx:s.vx*.5+nx/nl*sg*170*S,vy:Math.min(s.vy,0)*.3+ny/nl*sg*170*S-60*S,rot:0,vr:sg*rand(1.5,3.5),col:s.col,life:1.4,pct:ar/tot*100,mine:s.mine});});
    const[cx,cy]=centroid(wp);
    if(s.mine){G.lives=0;sfx.boom();G.shake=26;G.flash=1;burst(cx,cy,60,'#2a1b3d',520,6);burst(cx,cy,30,'#ff4f7b',420,5);vib([120,60,200]);text(cx,cy,'BUM!','#ff4f7b',44,1.4);hud();gameOver();return;}
    const small=Math.min(a1,a2)/tot*100;const err=Math.abs(small-s.tgt);G.errs.push(err);
    let gr,pts,col;
    const tol=G.wave<=3?1.5:1;if(err<=1.5){gr='PERFEITO';pts=100;col='#ff4f7b';}else if(err<=4){gr='ÓTIMO';pts=60;col='#7b5cff';}else if(err<=8){gr='BOM';pts=30;col='#2ec4b6';}else if(err<=12*tol){gr='QUASE';pts=10;col='#ffb627';}else{gr=null;}
    if(gr){
      if(err<=4)G.combo++;else G.combo=0;
      const m=mult();G.score+=pts*m;
      text(cx,cy-20*S,gr,col,gr==='PERFEITO'?40:30);text(cx,cy+18*S,`+${pts*m}`,'#2a1b3d',22);
      sfx.grade(gr,G.combo);vib(gr==='PERFEITO'?[15,20,25]:12);
      burst(cx,cy,gr==='PERFEITO'?40:18,s.col,gr==='PERFEITO'?460:280);
      if(gr==='PERFEITO'){G.perfects++;store.perfects++;G.slowT=.38;G.flash=.6;}
    }else{loseLife(cx,cy,'Errou feio');}
    hud();
  }
  if(any)sfx.slice();
}
function gameOver(){
  if(state!=='play')return;state='dying';
  store.games++;const rec=G.score>store.best;if(rec)store.best=G.score;save();sfx.over();
  setTimeout(()=>{state='over';$('#oScore').textContent=G.score;$('#oPerf').textContent=G.perfects;
    const avg=G.errs.length?G.errs.reduce((a,b)=>a+b,0)/G.errs.length:0;$('#oAvg').textContent=G.errs.length?avg.toFixed(1).replace('.',',')+'%':'—';$('#oWave').textContent=G.wave;
    $('#oRec').innerHTML=rec&&G.score>0?'<span class="rec">★ Novo recorde ★</span>':`<div class="lbl" style="margin-top:8px">Recorde ${store.best}</div>`;
    $('#over').classList.remove('hidden');$('#hud').classList.add('hidden');},1200);
}
function update(dt){
  T+=dt;if(!G)return;
  if(G.slowT>0){G.slowT-=dt;G.ts=.25;}else G.ts=Math.min(1,G.ts+dt*3);
  const sd=dt*G.ts;
  G.flash=Math.max(0,G.flash-dt*2.5);G.shake=Math.max(0,G.shake-dt*40);
  if(state==='play'){
    const live=G.shapes.filter(s=>s.alive).length;
    if(live===0){G.waveT-=dt;if(G.waveT<=0){G.shapes=[];spawnWave();G.waveT=Math.max(.35,.9-G.wave*.03);hud();}}
    for(const s of G.shapes){if(!s.alive)continue;if(s.delay>0){s.delay-=sd;continue;}
      s.vy+=s.g*sd;s.x+=s.vx*sd;s.y+=s.vy*sd;s.rot+=s.vr*sd;
      if(s.x<s.r*.6&&s.vx<0)s.vx*=-1;if(s.x>W-s.r*.6&&s.vx>0)s.vx*=-1;
      if(s.vy>0&&s.y>H+s.r+20){s.alive=false;if(!s.mine)loseLife(clamp(s.x,60,W-60),H-60,'Caiu!');}}
  }
  for(const p of G.pieces){p.vy+=900*S*sd;p.x+=p.vx*sd;p.y+=p.vy*sd;p.rot+=p.vr*sd;p.life-=sd;}
  G.pieces=G.pieces.filter(p=>p.life>0&&p.y<H+300);
  for(const p of G.parts){p.vy+=500*S*sd;p.x+=p.vx*sd;p.y+=p.vy*sd;p.life-=sd;}
  G.parts=G.parts.filter(p=>p.life>0);
  for(const t of G.texts){t.life-=dt;t.y-=30*dt;}
  G.texts=G.texts.filter(t=>t.life>0);
}
function poly(p){ctx.beginPath();p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#fff4e6';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(42,27,61,.045)';const gs=34*S;for(let y=-gs+(T*12%gs);y<H;y+=gs)for(let x=0;x<W;x+=gs){ctx.beginPath();ctx.arc(x+((y/gs|0)%2)*gs/2,y,2*S,0,TAU);ctx.fill();}
  if(!G){demoDraw();return;}
  const sx=(Math.random()-.5)*G.shake,sy=(Math.random()-.5)*G.shake;ctx.setTransform(DPR,0,0,DPR,sx*DPR,sy*DPR);
  for(const s of G.shapes){if(!s.alive||s.delay>0)continue;drawShape(s);}
  for(const p of G.pieces){const a=Math.min(1,p.life/.4);ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);poly(p.pts);ctx.fillStyle=p.col;ctx.fill();ctx.lineWidth=3*S;ctx.strokeStyle='#2a1b3d';ctx.stroke();ctx.restore();
    if(!p.mine&&p.life>.55){ctx.globalAlpha=Math.min(1,(p.life-.55)*3);ctx.font=`700 ${17*S}px Fredoka`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='#fff';const t=p.pct.toFixed(1).replace('.',',')+'%';ctx.strokeText(t,p.x,p.y);ctx.fillStyle='#2a1b3d';ctx.fillText(t,p.x,p.y);ctx.globalAlpha=1;}}
  for(const p of G.parts){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.sz*S,0,TAU);ctx.fill();}
  ctx.globalAlpha=1;
  // linha de corte
  if(sw&&state==='play'){const A=sw.a,B=sw.b;const dx=B[0]-A[0],dy=B[1]-A[1],l=Math.hypot(dx,dy);
    if(l>4){const ux=dx/l,uy=dy/l,E=Math.max(W,H)*2;ctx.strokeStyle='rgba(255,79,123,.22)';ctx.lineWidth=1.5;ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(A[0]-ux*E,A[1]-uy*E);ctx.lineTo(A[0]+ux*E,A[1]+uy*E);ctx.stroke();ctx.setLineDash([]);
      ctx.strokeStyle='#ff4f7b';ctx.lineWidth=4*S;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();
      ctx.fillStyle='#fff';ctx.strokeStyle='#ff4f7b';ctx.lineWidth=2;for(const P of[A,B]){ctx.beginPath();ctx.arc(P[0],P[1],5*S,0,TAU);ctx.fill();ctx.stroke();}}}
  for(const t of G.texts){const k=t.life/t.max;ctx.globalAlpha=Math.min(1,k*3);const sc=1+Math.max(0,(k-.8))*2;ctx.font=`700 ${t.sz*S*sc}px Fredoka`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=6;ctx.strokeStyle='#fff';ctx.strokeText(t.s,t.x,t.y);ctx.fillStyle=t.c;ctx.fillText(t.s,t.x,t.y);}
  ctx.globalAlpha=1;
  if(G.flash>0){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle=`rgba(255,255,255,${G.flash*.6})`;ctx.fillRect(0,0,W,H);}
}
function drawShape(s){
  const wp=world(s);
  ctx.save();ctx.fillStyle='rgba(42,27,61,.12)';ctx.translate(5*S,7*S);poly(wp);ctx.fill();ctx.restore();
  poly(wp);ctx.fillStyle=s.col;ctx.fill();ctx.lineWidth=3.5*S;ctx.strokeStyle='#2a1b3d';ctx.lineJoin='round';ctx.stroke();
  if(s.mine){ctx.fillStyle='#ff4f7b';ctx.beginPath();ctx.arc(s.x,s.y,s.r*.28,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.font=`700 ${s.r*.4}px Fredoka`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✕',s.x,s.y+1);return;}
  const[cx,cy]=centroid(wp);
  ctx.font=`700 ${s.r*.55}px Fredoka`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=5*S;ctx.strokeStyle='#2a1b3d';ctx.strokeText(TGT[s.tgt],cx,cy);ctx.fillStyle='#fff';ctx.fillText(TGT[s.tgt],cx,cy);
}
const demo=[];
function demoDraw(){
  if(!demo.length)for(let i=0;i<6;i++){const k=Object.keys(SHAPES);demo.push({pts:norm(SHAPES[pick(k)]()),x:rand(0,W),y:rand(0,H),r:rand(30,60)*S,rot:rand(0,TAU),vr:rand(-.5,.5),col:pick(PAL),vy:rand(-20,-40)});}
  for(const d of demo){d.rot+=d.vr/60;d.y+=d.vy/60;if(d.y<-80)d.y=H+80;const c=Math.cos(d.rot),s=Math.sin(d.rot);ctx.globalAlpha=.35;poly(d.pts.map(([x,y])=>[d.x+(x*c-y*s)*d.r,d.y+(x*s+y*c)*d.r]));ctx.fillStyle=d.col;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#2a1b3d';ctx.stroke();ctx.globalAlpha=1;}
}

// ---------- entrada
let sw=null;
cv.addEventListener('pointerdown',e=>{AU.init();if(state!=='play')return;sw={a:[e.clientX,e.clientY],b:[e.clientX,e.clientY],id:e.pointerId};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(sw&&e.pointerId===sw.id)sw.b=[e.clientX,e.clientY];});
cv.addEventListener('pointerup',e=>{if(sw&&e.pointerId===sw.id){sw.b=[e.clientX,e.clientY];if(state==='play')cut(sw.a,sw.b);sw=null;}});
cv.addEventListener('pointercancel',()=>{sw=null;});
$('#play').onclick=()=>{AU.init();newGame();};
$('#again').onclick=()=>{AU.init();newGame();};
$('#toMenu').onclick=()=>{state='menu';G=null;$('#over').classList.add('hidden');$('#menu').classList.remove('hidden');renderMenu();};
function renderMenu(){$('#mBest').textContent=store.best?`Recorde ${store.best} · ${store.perfects} cortes perfeitos`:'';}

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame);}
window.__fatia={get G(){return G},get state(){return state},cut,newGame,update,world,centroid};
resize();renderMenu();requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
</body>
