<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lume">
<meta name="description" content="Lume, o Último Farol: guie navios com o feixe de luz, enfrente a névoa e construa a vila da sua ilha.">
<title>Lume — O Último Farol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3c56b;--gold2:#ffe2a0;--ink:#eef2fa;--mute:#9aa7bf;--panel:rgba(9,16,33,.84);--line:rgba(243,197,107,.28);--red:#ff6f5e;--green:#86e3a6;--violet:#b8a6ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;background:#020611;color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;overscroll-behavior:none;position:fixed;inset:0;width:100%}
canvas{position:fixed;inset:0;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}
b{color:var(--gold2)}

#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;pointer-events:none;z-index:5}
.row{display:flex;align-items:center;gap:8px}
#nightLbl{font-family:Cinzel,serif;font-weight:800;color:var(--gold2);font-size:15px;letter-spacing:.06em;text-shadow:0 2px 10px #000;white-space:nowrap}
#flame{flex:1;height:16px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;position:relative;border:1px solid rgba(255,180,100,.35);box-shadow:0 0 14px rgba(255,140,60,.15)}
#flameFill{height:100%;width:100%;background:linear-gradient(90deg,#ff4f24,#ffa83d,#ffe58e);transition:width .3s}
#flameTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#2b1205;text-shadow:0 0 4px rgba(255,240,200,.8)}
#flame.low{animation:lowf 1s infinite}
@keyframes lowf{50%{box-shadow:0 0 18px rgba(255,60,40,.8);border-color:#ff5a3a}}
#pauseBtn{pointer-events:auto;width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;font-weight:900;color:var(--gold2)}
#res{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:3px 10px 3px 7px;font-weight:900;font-size:13px;display:flex;align-items:center;gap:4px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .2s}
.chip.bump{animation:bump .45s}
@keyframes bump{35%{transform:scale(1.22);border-color:var(--gold);box-shadow:0 0 12px rgba(243,197,107,.6)}}
#nightBar{margin-top:7px}
#timer{height:5px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}
#timerFill{height:100%;width:0;background:linear-gradient(90deg,#3b4f8f,#9fb6ff,#ffe2a0)}
#contract{margin-top:6px;font-size:12px;font-weight:800;color:var(--mute);line-height:1.35;text-shadow:0 1px 4px #000}
#contract .ok{color:var(--green)}
#contract .bad{color:var(--red)}

#flashBtn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:78px;height:78px;border-radius:50%;z-index:6;padding:4px;background:conic-gradient(var(--gold) var(--p,100%),rgba(255,255,255,.08) 0);box-shadow:0 6px 24px rgba(0,0,0,.5)}
#flashBtn .in{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 38%,#26325a,#0a1124);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;line-height:1}
#flashBtn small{font-size:9px;font-weight:900;letter-spacing:.08em;color:var(--mute);margin-top:3px;text-transform:uppercase}
#flashBtn.ready .in{box-shadow:inset 0 0 22px rgba(255,214,120,.75)}
#flashBtn.ready small{color:var(--gold2)}
#flashBtn.ready{animation:rdy 1.6s infinite}
@keyframes rdy{50%{box-shadow:0 0 26px rgba(255,214,120,.55)}}

#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 118px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:7;pointer-events:none;padding:0 18px}
.toast{background:rgba(8,14,30,.9);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;max-width:420px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .35s ease-out}
.toast.out{animation:tout .4s ease-in forwards}
@keyframes tin{from{opacity:0;transform:translateY(-10px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}
#combo{position:fixed;left:0;right:0;top:42%;text-align:center;font-family:Cinzel,serif;font-weight:800;font-size:34px;color:var(--gold2);text-shadow:0 0 18px rgba(255,190,80,.9),0 3px 0 #5a2a00;pointer-events:none;z-index:6;opacity:0}
#combo.go{animation:cmb 1s ease-out}
@keyframes cmb{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.15)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1) translateY(-30px)}}

#dayPanel{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:26px 0 calc(env(safe-area-inset-bottom) + 10px);background:linear-gradient(to top,rgba(4,9,20,.97) 72%,rgba(4,9,20,0))}
#dayInfo{padding:0 14px 6px;font-size:12.5px;font-weight:800;color:var(--mute);min-height:20px}
#cards{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 10px;scroll-snap-type:x proximity;touch-action:pan-x;scrollbar-width:none}
#cards::-webkit-scrollbar{display:none}
.card{flex:0 0 112px;scroll-snap-align:start;background:linear-gradient(180deg,rgba(28,38,66,.95),rgba(13,20,40,.95));border:1px solid rgba(255,255,255,.09);border-radius:16px;padding:9px 9px 8px;text-align:left;position:relative;transition:transform .15s,border-color .15s}
.card:active{transform:scale(.96)}
.card.sel{border-color:var(--gold);box-shadow:0 0 16px rgba(243,197,107,.4)}
.card.off{opacity:.5}
.card .ic{font-size:24px;line-height:1.1}
.card .nm{font-weight:900;font-size:12.5px;margin-top:3px;line-height:1.15;min-height:29px}
.card .cs{font-size:11.5px;font-weight:800;margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 6px}
.card .ct{position:absolute;top:7px;right:8px;font-size:10.5px;font-weight:900;color:var(--mute)}
.card.special{background:linear-gradient(180deg,rgba(70,48,16,.95),rgba(30,20,8,.95));border-color:rgba(243,197,107,.35)}
.no{color:var(--red)}
.dayActions{padding:0 12px;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:14px;font-weight:900;font-size:15px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(180deg,#ffd57e,#e9a23b);color:#2a1503;border:0;box-shadow:0 6px 22px rgba(240,170,60,.35)}
.btn.ghost{background:transparent}
.btn.wide{flex:1}
.btn[disabled]{opacity:.45;pointer-events:none}
#confirmBar{position:fixed;left:12px;right:12px;z-index:8;background:rgba(10,18,36,.96);border:1px solid var(--gold);border-radius:16px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);animation:tin .2s}
#confirmBar .tx{flex:1;font-size:13px;font-weight:800;line-height:1.3}
#confirmBar .btn{padding:10px 14px;font-size:14px}

#menu{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 9vh) 22px calc(env(safe-area-inset-bottom) + 22px);background:radial-gradient(ellipse at 50% 120%,rgba(0,0,0,0),rgba(2,6,16,.35))}
.title{text-align:center;animation:tin 1.2s}
.logo{font-family:Cinzel,serif;font-weight:800;font-size:clamp(58px,19vw,104px);letter-spacing:.14em;margin-left:.14em;background:linear-gradient(180deg,#fff6d8,#f3c56b 55%,#b07528);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 24px rgba(255,200,110,.45))}
.sub{font-family:Cinzel,serif;font-weight:600;letter-spacing:.32em;font-size:13px;color:var(--gold2);opacity:.85;margin-top:-4px}
.tag{margin-top:14px;font-size:13.5px;color:var(--mute);font-weight:700;max-width:300px;line-height:1.4;margin-left:auto;margin-right:auto}
.menuBtns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;animation:tin 1.4s}
.menuBtns .btn{width:100%;padding:15px}
.menuRow{display:flex;gap:10px}
.menuRow .btn{flex:1;padding:12px 8px;font-size:13.5px}
.foot{font-size:11.5px;color:var(--mute);margin-top:12px;text-align:center;font-weight:700}

#modal{position:fixed;inset:0;z-index:20;background:rgba(1,4,12,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:18px}
.mcard{width:100%;max-width:400px;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,#141f3d,#0a1226);border:1px solid var(--line);border-radius:22px;padding:20px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}}
.mcard h2{font-family:Cinzel,serif;font-weight:800;font-size:23px;color:var(--gold2);text-align:center;letter-spacing:.04em}
.mcard h3{font-size:13px;font-weight:900;color:var(--gold);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.08em}
.mcard p{font-size:14px;line-height:1.5;color:#d7deec;margin-top:8px;font-weight:600}
.mcard .big{font-size:42px;text-align:center;line-height:1.1}
.mcard .lead{text-align:center;color:var(--mute);font-size:13.5px;margin-top:4px}
.mbtns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.mbtns .btn{flex:1;min-width:120px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}
.stat{background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}
.stat .k{font-size:11px;color:var(--mute);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:17px;font-weight:900;margin-top:1px}
.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:13.5px;font-weight:700}
.line:last-child{border-bottom:0}
.line .r{font-weight:900;text-align:right}
.pos{color:var(--green)}.neg{color:var(--red)}
.upg{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.045);border-radius:14px;margin-top:8px}
.upg .ic{font-size:24px;width:32px;text-align:center}
.upg .mid{flex:1;min-width:0}
.upg .nm{font-weight:900;font-size:14px}
.upg .ds{font-size:11.5px;color:var(--mute);font-weight:700;margin-top:1px}
.dots{display:flex;gap:3px;margin-top:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.12)}
.dots i.on{background:var(--gold)}
.upg .btn{padding:9px 11px;font-size:12px;flex-direction:column;gap:1px;min-width:78px}
.parch{background:linear-gradient(180deg,#f3e6c4,#e2cf9f);color:#3a2a14;border-radius:14px;padding:18px 16px;margin-top:12px;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:16.5px;line-height:1.55;box-shadow:inset 0 0 30px rgba(120,80,20,.35)}
.parch .sig{text-align:right;margin-top:10px;font-size:13px;opacity:.75}
.event{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.05);border-radius:14px;padding:12px;margin-top:12px}
.event .ic{font-size:30px}
.event .nm{font-weight:900;font-size:15px}
.event .ds{font-size:12.5px;color:#c7d0e2;font-weight:700;margin-top:2px;line-height:1.35}
.storyItem{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);margin-top:8px;font-size:13.5px;line-height:1.45;font-style:italic;font-family:Georgia,serif;color:#e7dcc0}
.storyItem.locked{font-style:normal;font-family:inherit;color:var(--mute);font-weight:800}
.perk{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.045);margin-top:8px}
.perk.own{border:1px solid rgba(134,227,166,.4);background:rgba(134,227,166,.07)}
.perk .ic{font-size:24px;width:32px;text-align:center}
.perk .mid{flex:1}
.perk .nm{font-weight:900;font-size:14px}
.perk .ds{font-size:12px;color:var(--mute);font-weight:700}
.perk .btn{padding:9px 12px;font-size:13px}
.nw{white-space:nowrap}
#toasts.low{top:auto;bottom:var(--tb,240px);flex-direction:column-reverse}
.kbd{display:inline-block;padding:1px 7px;border-radius:6px;background:rgba(255,255,255,.1);font-weight:900}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="hidden">
  <div class="row">
    <div id="nightLbl">Noite 1</div>
    <div id="flame"><div id="flameFill"></div><div id="flameTxt">🔥 100</div></div>
    <button id="pauseBtn" aria-label="Pausar">II</button>
  </div>
  <div id="res"></div>
  <div id="nightBar" class="hidden">
    <div id="timer"><div id="timerFill"></div></div>
    <div id="contract"></div>
  </div>
</div>

<button id="flashBtn" class="hidden" aria-label="Lampejo"><div class="in">✴<small>Lampejo</small></div></button>
<div id="combo"></div>
<div id="toasts"></div>

<div id="dayPanel" class="hidden">
  <div id="dayInfo"></div>
  <div id="cards"></div>
  <div class="dayActions"><button id="nightBtn" class="btn primary wide">🔥 Acender o farol</button></div>
</div>
<div id="confirmBar" class="hidden"></div>

<div id="menu">
  <div class="title">
    <div class="logo">LUME</div>
    <div class="sub">O ÚLTIMO FAROL</div>
    <div class="tag">Os navios só enxergam o que a sua luz revela. A névoa só teme o que a sua luz alcança.</div>
  </div>
  <div style="width:100%;display:flex;flex-direction:column;align-items:center">
    <div class="menuBtns" id="menuBtns"></div>
    <div class="foot" id="menuFoot"></div>
  </div>
</div>

<div id="modal" class="hidden"><div class="mcard" id="mcard"></div></div>

<script>
(()=>{
'use strict';
// =====================================================================
//  Utilidades
// =====================================================================
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, SQ3=Math.sqrt(3);
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const angDiff=(a,b)=>{let d=((b-a)%TAU+TAU)%TAU; if(d>Math.PI)d-=TAU; return d;};
const hash=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);};
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mixc(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')';}
function weighted(obj){let tot=0;for(const k in obj)tot+=obj[k];let r=Math.random()*tot;for(const k in obj){r-=obj[k];if(r<=0)return k;}return Object.keys(obj)[0];}
function vib(p){try{if(meta.vib!==false&&navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function loadJSON(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function delKey(k){try{localStorage.removeItem(k);}catch(e){}}

// =====================================================================
//  Dados do jogo
// =====================================================================
const RES=['fish','wood','stone','gold'];
const RIC={fish:'🐟',wood:'🪵',stone:'🪨',gold:'🪙',pop:'👥'};
const HS=11;          // tamanho do hexágono (unidades do mundo)
const TOWER=30;       // altura da torre
const OY=-TOWER+3;    // origem do feixe (lanterna)

const B={
  casa:{n:'Casa',ic:'🏠',cost:{wood:4},work:0,desc:'+3 moradias. Ganha +1 moradia para cada Jardim vizinho.'},
  rede:{n:'Pesqueiro',ic:'🎣',cost:{wood:3},work:1,coast:true,desc:'Só na costa. +2 peixes ao amanhecer, +1 se houver um Cais vizinho.'},
  cais:{n:'Cais',ic:'⚓',cost:{wood:5,stone:1},work:1,coast:true,desc:'Só na costa. Cada navio atracado traz +1 de carga.'},
  jardim:{n:'Jardim',ic:'🌿',cost:{wood:2,stone:1},work:0,desc:'Casas vizinhas ganham +1 moradia. Reacende +3 de chama a cada amanhecer.'},
  mercado:{n:'Mercado',ic:'⚖️',cost:{wood:4,stone:2},work:1,desc:'+2 ouro ao amanhecer, +1 por Casa vizinha (máx. +3).'},
  oficina:{n:'Oficina de Lentes',ic:'🔍',cost:{stone:4,gold:2},work:1,desc:'+8% de alcance do feixe principal.'},
  sino:{n:'Sino da Névoa',ic:'🔔',cost:{wood:3,stone:3,gold:1},work:0,desc:'Navios perdidos no escuro passam a derivar em direção à ilha.'},
  espelho:{n:'Torre de Espelhos',ic:'💎',cost:{stone:6,gold:4},work:1,max:3,desc:'Projeta um feixe giratório automático. Cuidado: também ilumina fantasmas.'},
  santuario:{n:'Capela de Sal',ic:'🕯️',cost:{stone:5,gold:3},work:1,desc:'+15 de chama máxima. Névoas sofrem +25% de dano e ferem menos o farol.'},
};
const UP={
  alcance:{n:'Alcance',ic:'📏',d:'+12% de alcance do feixe',max:6,cost:L=>({wood:3+2*L,stone:2+2*L})},
  abertura:{n:'Abertura',ic:'📐',d:'Feixe mais largo',max:6,cost:L=>({stone:3+2*L,gold:1+L})},
  intensidade:{n:'Intensidade',ic:'🔥',d:'+25% de dano às névoas e navios mais rápidos na luz',max:6,cost:L=>({gold:2+2*L,stone:2+L})},
  lampejo:{n:'Lampejo',ic:'✴️',d:'Recarga 12% menor e raio maior',max:5,cost:L=>({gold:3+2*L,fish:3+2*L})},
};
const SHIP={
  pesca:{spd:27,size:7,cargo:{fish:3},hull:'#8a5a34',deck:'#b98a5a',sail:'#efe6d2'},
  carga:{spd:18,size:11,cargo:{wood:4,stone:1},hull:'#6e4426',deck:'#a8774a',sail:'#f3ead8'},
  pedra:{spd:15,size:10,cargo:{stone:4},hull:'#555a62',deck:'#7c828c',sail:null},
  ouro:{spd:21,size:12,cargo:{gold:3,wood:2},hull:'#5a2f1d',deck:'#8a5131',sail:'#f3c56b'},
  balsa:{spd:12,size:6,cargo:{pop:2},hull:'#a07a4a',deck:'#c49b66',sail:null},
  garrafa:{spd:10,size:3.5,cargo:{gold:2},hull:'#4fae7e',deck:'#4fae7e',sail:null},
  fantasma:{spd:22,size:12,cargo:{},hull:'#7dffc0',deck:'#7dffc0',sail:'#c8ffe6'},
};
const EVENTS={
  tempestade:{n:'Tempestade',ic:'⛈️',d:'O alcance do feixe cai 25% e o vento empurra os barcos. Relâmpagos revelam as rochas por instantes.'},
  lua:{n:'Lua Cheia',ic:'🌕',d:'A escuridão é mais rala e mais navios se aventuram pelo mar.'},
  mortos:{n:'Maré dos Mortos',ic:'👻',d:'Navios fantasmas e névoas em dobro. Escolha muito bem onde apontar a luz.'},
  cardume:{n:'Cardume',ic:'🐟',d:'Barcos pesqueiros por toda parte. Noite de fartura.'},
  neblina:{n:'Neblina Densa',ic:'🌫️',d:'As lanternas dos barcos só são vistas quando estão perto do farol.'},
  calmaria:{n:'Calmaria',ic:'🌊',d:'Uma noite tranquila. Nenhuma névoa à vista, poucos navios.'},
  recifes:{n:'Maré Baixa',ic:'🪨',d:'Muito mais rochas afloram. Ilumine o caminho antes que seja tarde.'},
};

const key=(q,r)=>q+','+r;
const unkey=k=>k.split(',').map(Number);
const DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
function hexToWorld(q,r){return[HS*SQ3*(q+r/2),HS*1.5*r];}
function hexRound(q,r){const s=-q-r;let rq=Math.round(q),rr=Math.round(r);const rs=Math.round(s);const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs-s);if(dq>dr&&dq>ds)rq=-rr-rs;else if(dr>ds)rr=-rq-rs;return[rq,rr];}
function worldToHex(x,y){return hexRound((SQ3/3*x-y/3)/HS,(2/3*y)/HS);}
function hexDist(q,r){return(Math.abs(q)+Math.abs(r)+Math.abs(q+r))/2;}
function IRof(st){return(st.gridR+0.75)*SQ3*HS;}
function adjCount(st,q,r,t){let n=0;for(const[dq,dr]of DIRS){const b=st.grid[key(q+dq,r+dr)];if(b&&b.t===t)n++;}return n;}
function allHexes(R){const out=[];for(let q=-R;q<=R;q++)for(let r=Math.max(-R,-q-R);r<=Math.min(R,-q+R);r++)out.push([q,r]);return out;}

function countB(t,st=S){let n=0;for(const k in st.grid)if(st.grid[k].t===t)n++;return n;}
function activeMap(st=S){
  const list=Object.entries(st.grid).filter(([k,b])=>B[b.t]&&B[b.t].work>0).sort((a,b)=>a[1].o-b[1].o);
  let w=st.pop;const act={};
  for(const[k,b]of list){if(w>=B[b.t].work){act[k]=true;w-=B[b.t].work;}else act[k]=false;}
  for(const k in st.grid){const b=st.grid[k];if(!B[b.t]||B[b.t].work===0)act[k]=true;}
  return act;
}
function workersUsed(act,st=S){let u=0;for(const k in st.grid){const b=st.grid[k];if(B[b.t]&&B[b.t].work&&act[k])u+=B[b.t].work;}return u;}
function activeCount(t,st=S){const a=activeMap(st);let n=0;for(const k in st.grid)if(st.grid[k].t===t&&a[k])n++;return n;}
function housing(st=S){let h=4;for(const k in st.grid){if(st.grid[k].t==='casa'){const[q,r]=unkey(k);h+=3+adjCount(st,q,r,'jardim');}}return h;}
function flameMax(st=S){return 100+(meta.perks.brasa?25:0)+15*activeCount('santuario',st);}
function costOf(t){const n=countB(t);const c={};for(const k in B[t].cost)c[k]=Math.ceil(B[t].cost[k]*(1+0.3*n));return c;}
function canAfford(c){for(const k in c)if((S.res[k]||0)<c[k])return false;return true;}
function pay(c){for(const k in c)S.res[k]-=c[k];}
function costHTML(c){return Object.keys(c).filter(k=>c[k]>0).map(k=>`<span class="nw ${(S.res[k]||0)<c[k]?'no':''}">${RIC[k]}${c[k]}</span>`).join(' ');}
function gainHTML(g){return Object.keys(g).filter(k=>g[k]).map(k=>`<span class="nw">${g[k]>0?'+':''}${g[k]}${RIC[k]}</span>`).join(' ');}
function expandCost(){const g=S.gridR;return{wood:6*(g-1),stone:5*(g-1),gold:Math.max(0,(g-3)*4)};}
const REPAIR={wood:2,stone:2};
function validSpot(t,q,r){
  const d=hexDist(q,r);
  if(d===0||d>S.gridR)return false;
  if(S.grid[key(q,r)])return false;
  if(B[t].coast&&d!==S.gridR)return false;
  return true;
}
function previewGain(t,q,r){
  const st=S;
  switch(t){
    case 'casa':{const h=3+adjCount(st,q,r,'jardim');let s=`+${h} moradias`;let g=0;for(const[dq,dr]of DIRS){const b=st.grid[key(q+dq,r+dr)];if(b&&b.t==='mercado'&&adjCount(st,q+dq,r+dr,'casa')<3)g++;}if(g)s+=`, +${g}🪙/dia`;return s;}
    case 'jardim':{const c=adjCount(st,q,r,'casa');return `+${c} moradia${c===1?'':'s'}, +3🔥/dia`;}
    case 'rede':return `+${2+(adjCount(st,q,r,'cais')?1:0)}🐟 por dia`;
    case 'cais':{let x=0;for(const[dq,dr]of DIRS){const b=st.grid[key(q+dq,r+dr)];if(b&&b.t==='rede'&&!adjCount(st,q+dq,r+dr,'cais'))x++;}return `+1 de carga por navio${x?`, +${x}🐟/dia`:''}`;}
    case 'mercado':return `+${2+Math.min(3,adjCount(st,q,r,'casa'))}🪙 por dia`;
    default:return B[t].desc;
  }
}

const SFX={ac:null,master:null,buf:null,musicT:1,ci:0,hissT:0,
  init(){
    if(this.ac){if(this.ac.state==='suspended')this.ac.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const ac=this.ac=new AC();
    this.master=ac.createGain();this.master.gain.value=meta.sound?0.8:0;this.master.connect(ac.destination);
    const len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.buf=buf;
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;
    const g=ac.createGain();g.gain.value=0.05;
    const lfo=ac.createOscillator();lfo.frequency.value=0.11;const lg=ac.createGain();lg.gain.value=0.035;lfo.connect(lg);lg.connect(g.gain);
    src.connect(lp);lp.connect(g);g.connect(this.master);src.start();lfo.start();
    this.bus=ac.createGain();this.bus.gain.value=0.55;const ml=ac.createBiquadFilter();ml.type='lowpass';ml.frequency.value=1400;this.bus.connect(ml);ml.connect(this.master);
  },
  setOn(on){meta.sound=on;saveMeta();if(this.master)this.master.gain.setTargetAtTime(on?0.8:0,this.ac.currentTime,0.05);},
  tone(f,d=.3,type='sine',v=.15,delay=0,f2=null,dest=null){
    if(!this.ac||!meta.sound)return;const ac=this.ac,t=ac.currentTime+delay;
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g);g.connect(dest||this.master);o.start(t);o.stop(t+d+0.05);
  },
  noise(d=.3,type='lowpass',f=800,v=.2,f2=null,delay=0){
    if(!this.ac||!meta.sound)return;const ac=this.ac,t=ac.currentTime+delay;
    const s=ac.createBufferSource();s.buffer=this.buf;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);
    if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(fl);fl.connect(g);g.connect(this.master);s.start(t,Math.random()*1.5);s.stop(t+d+0.05);
  },
  music(dt,night){
    if(!this.ac||!meta.sound)return;this.musicT-=dt;if(this.musicT>0)return;this.musicT=7.5;
    const ch=night?[[57,60,64],[53,57,60],[48,52,55],[55,59,62],[57,60,64],[50,53,57],[52,55,59],[53,57,60]]:[[60,64,67],[55,59,62],[57,60,64],[53,57,60]];
    const c=ch[this.ci++%ch.length];const ac=this.ac,t=ac.currentTime;
    c.forEach((m,i)=>{const f=440*Math.pow(2,(m-69)/12)*(night?0.5:1);
      for(const det of[-4,4]){const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;o.detune.value=det;
        g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.022,t+2.6+i*0.15);g.gain.linearRampToValueAtTime(0.016,t+5.5);g.gain.linearRampToValueAtTime(0.0001,t+8.6);
        o.connect(g);g.connect(this.bus);o.start(t);o.stop(t+8.8);}
    });
    if(night&&Math.random()<0.5){const m=c[2]+12+pick([0,2,4,7]);this.tone(440*Math.pow(2,(m-69)/12),2.2,'sine',0.025,rand(1,4),null,this.bus);}
  },
  dock(c){const sc=[0,2,4,7,9,12,14,16,19];const n=sc[Math.min(c-1,8)];const f=523.25*Math.pow(2,n/12);this.tone(f,.55,'sine',.14);this.tone(f*1.5,.4,'triangle',.04,.05);},
  wreck(){this.noise(.7,'lowpass',1200,.32,120);this.tone(95,.6,'sine',.25,0,40);},
  hit(){this.tone(70,.9,'sine',.35,0,32);this.noise(.6,'lowpass',500,.3,80);},
  flash(){this.noise(.8,'highpass',600,.16,6000);this.tone(1046,1.3,'sine',.09,.02);this.tone(1568,1.1,'sine',.05,.07);},
  dissolve(){this.noise(.45,'bandpass',2600,.08,500);},
  ghost(){this.tone(220,1.6,'sawtooth',.045,0,105);this.tone(233,1.6,'sine',.08,0,110);this.noise(1.2,'bandpass',400,.08,1800);},
  click(){this.tone(900,.05,'square',.025);},
  build(){this.tone(196,.16,'triangle',.22);this.tone(294,.22,'triangle',.12,.08);this.noise(.08,'lowpass',2200,.15);},
  coin(){this.tone(1318,.15,'square',.035);this.tone(1760,.28,'square',.035,.07);},
  bell(){[392,523,659,784].forEach((f,i)=>this.tone(f,2.4,'sine',.07,i*0.04));this.tone(196,2.6,'sine',.08);},
  bad(){this.tone(260,.22,'square',.035,0,180);},
  star(){[1568,1976,2349,3136].forEach((f,i)=>this.tone(f,.5,'sine',.05,i*0.06));},
  hiss(){const now=performance.now();if(now-this.hissT<160)return;this.hissT=now;this.noise(.18,'bandpass',rand(2500,4200),.025);},
};

function toast(html,ms=3200){
  const el=document.createElement('div');el.className='toast';el.innerHTML=html;$('#toasts').appendChild(el);
  while($('#toasts').children.length>3)$('#toasts').firstChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),400);},ms);
}
function hint(id,html,ms=4200){if(meta.hints[id])return;meta.hints[id]=1;saveMeta();toast('💡 '+html,ms);}
function modal(html,buttons=[],cls=''){
  const mc=$('#mcard');mc.className='mcard '+cls;
  mc.innerHTML=html+(buttons.length?'<div class="mbtns">'+buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}" ${b.dis?'disabled':''}>${b.t}</button>`).join('')+'</div>':'');
  $('#modal').classList.remove('hidden');modalOpen=true;
  mc.querySelectorAll('.mbtns .btn').forEach(el=>el.onclick=()=>{SFX.click();const b=buttons[+el.dataset.i];if(!b.keep)closeModal();b.fn&&b.fn();});
  mc.scrollTop=0;
}

const hudCache={};
function setHTML(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).innerHTML=v;}}
const prevRes={};
function updateHUD(){
  if(!S)return;
  setHTML('#nightLbl',phase==='night'||phase==='over'?`Noite ${S.night}`:`Dia ${S.night}`);
  const fm=flameMax();const fr=clamp(S.flame/fm,0,1);
  const fw=(fr*100).toFixed(1)+'%';if(hudCache.fw!==fw){hudCache.fw=fw;$('#flameFill').style.width=fw;$('#flame').classList.toggle('low',fr<0.3);}
  setHTML('#flameTxt',`🔥 ${Math.max(0,Math.ceil(S.flame))}/${fm}`);
  const h=housing();
  let html='';
  for(const k of RES)html+=`<div class="chip" id="ch_${k}">${RIC[k]} ${S.res[k]}</div>`;
  html+=`<div class="chip" id="ch_pop">👥 ${S.pop}/${h}</div>`;
  if(hudCache.res!==html){
    hudCache.res=html;$('#res').innerHTML=html;
    for(const k of [...RES,'pop']){const v=k==='pop'?S.pop:S.res[k];if(prevRes[k]!==undefined&&v>prevRes[k]){const el=$('#ch_'+k);el.classList.add('bump');}prevRes[k]=v;}
  }
  if(phase==='night'&&N){
    const tw=(clamp(N.t/N.dur,0,1)*100).toFixed(1)+'%';if(hudCache.tw!==tw){hudCache.tw=tw;$('#timerFill').style.width=tw;}
    setHTML('#contract',contractLine());
    const p=N.flashCD<=0?100:(1-N.flashCD/N.flashMax)*100;const pp=p.toFixed(0)+'%';
    if(hudCache.fp!==pp){hudCache.fp=pp;$('#flashBtn').style.setProperty('--p',pp);$('#flashBtn').classList.toggle('ready',N.flashCD<=0);}
  }
}

function newRun(){

  S={night:1,res:{fish:6,wood:8+(p.heranca?10:0),stone:2+(p.heranca?6:0),gold:p.heranca?3:0},pop:3+(p.comunidade?3:0),
    flame:0,gridR:3,grid:{'0,0':{t:'farol',o:0}},order:0,up:{alcance:p.oleo?1:0,abertura:0,intensidade:0,lampejo:0},
    stats:{docked:0,lost:0,kills:0,rescued:0},storyRun:0,seed:Math.random()*100,next:null};
  S.flame=flameMax();
  rollNext();
  meta.runs++;saveMeta();
}
function saveRun(){if(!S)return;const c=Object.assign({},S);delete c.placing;delete c.pending;saveJSON(RUN_KEY,c);}
function rollNext(){
  const n=S.night;
  let ev=null;
  if(n>=3&&Math.random()<0.5){const pool=['tempestade','lua','mortos','cardume','neblina','recifes'];if(n<9)pool.push('calmaria');ev=pick(pool);}
  if(n===2&&Math.random()<0.35)ev=pick(['lua','cardume']);
  const pool=CONTRACTS.filter(c=>n>=c.min&&!(ev==='calmaria'&&(c.id==='kill'||c.id==='ghost')));
  const c=pick(pool);const o=c.mk(n);
  const rw=pick([{gold:2+Math.floor(n/2)},{stone:3+n},{wood:4+n},{gold:1+Math.floor(n/3),stone:2+Math.floor(n/2)}]);
  S.next={ev,contract:{id:c.id,t:o.t,goal:o.goal,reward:rw}};
}
function beamRange(st){return 225*(1+0.12*st.up.alcance+0.08*activeCount('oficina',st));}
function beamHalf(st){return(12.5+3.3*st.up.abertura)*Math.PI/180*(meta.perks.lente&&st===S?1.2:1);}

function setupNight(demo){
  const st=demo?DEMO:S;const n=demo?2:S.night;
  const ev=demo?null:(S.next&&S.next.ev);

  }
  // torres de espelhos

  if(demo){for(let i=0;i<5;i++){spawnShip(pick(['pesca','carga','pedra','ouro']));const s=N.ships[N.ships.length-1];s.age=2;const a=rand(0,TAU),d=rand(IR+60,260);s.x=Math.cos(a)*d;s.y=Math.sin(a)*d;}}

function addRock(x,y,r){const pts=[];const k=randi(6,9);for(let i=0;i<k;i++){const a=i/k*TAU+rand(-.2,.2);pts.push([Math.cos(a)*r*rand(.72,1.08),Math.sin(a)*r*rand(.72,1.08)]);}N.rocks.push({x,y,r,pts,rev:0,ph:rand(0,TAU)});}
function edgeDist(a,m){const z=nightZ();const hw=W/2/z+m,hh=H/2/z+m;const c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a));return Math.min(c>1e-4?hw/c:1e9,s>1e-4?hh/s:1e9);}

function beamAt(x,y,withIsland){
  if(withIsland){const R=IRof(ST())*1.28;if(x*x+y*y<R*R)return 1;}
  let v=0;const dx=x,dy=y-OY,d=Math.hypot(dx,dy);
  if(d<N.range&&Math.abs(angDiff(N.beamA,Math.atan2(dy,dx)))<N.half)v=1-d/N.range*0.5;
  if(N.flashT>0&&Math.hypot(x,y)<N.flashR*Math.min(1,(0.5-N.flashT)/0.12+0.2))v=Math.max(v,1);
  for(const m of N.mirrors){const mx=x-m.x,my=y-m.y,md=Math.hypot(mx,my);if(md<m.range&&Math.abs(angDiff(m.a,Math.atan2(my,mx)))<m.half)v=Math.max(v,.7);}
  return v;

function addPart(x,y,vx,vy,life,type,size,col){if(N.parts.length>700)return;N.parts.push({x,y,vx,vy,life,max:life,type,size,col});}

function updateNight(dt){
  const demo=N.demo;const st=ST();const IR=IRof(st);
  N.t+=dt;
  // feixe
  if(demo){N.beamA+=dt*0.5;}
  else if(input.down&&phase==='night'){
    const[wx,wy]=s2w(input.sx,input.sy);const tgt=Math.atan2(wy-OY,wx);const d=angDiff(N.beamA,tgt);const mx=12*dt;const step=clamp(d,-mx,mx);
    N.beamA+=step;if(Math.abs(step)>0.002)N.idleDir=Math.sign(step);
  }else N.beamA+=N.idleDir*0.3*dt;
  N.beamA=((N.beamA%TAU)+TAU)%TAU;
  for(const m of N.mirrors)m.a+=m.dir*0.85*dt;
  N.flashCD=Math.max(0,N.flashCD-dt);N.flashT=Math.max(0,N.flashT-dt);
  N.comboT=Math.max(0,N.comboT-dt);
  N.shake=Math.max(0,N.shake-dt*30);N.hurt=Math.max(0,N.hurt-dt*1.5);N.light=Math.max(0,N.light-dt*4);
  // eventos de clima
  if(N.ev==='tempestade'){N.lightT-=dt;if(N.lightT<=0){N.lightT=rand(5,11);N.light=1;for(const r of N.rocks)r.rev=Math.max(r.rev,.8);SFX.noise(1.6,'lowpass',300,.35,60,.25);}}
  // geração
  if(phase==='night'||demo){
    N.spawnT-=dt;if(N.spawnT<=0){N.spawnT=N.shipInt*rand(.7,1.3)*(demo?1.4:1);if(N.ships.filter(s=>s.type!=='fantasma').length<N.maxShips)spawnShip(weighted(N.weights));}
    if(N.wraithInt){N.wraithT-=dt;if(N.wraithT<=0){N.wraithT=N.wraithInt*rand(.7,1.3);const n=S.night;if(n>=5&&Math.random()<Math.min(.45,.12+.04*n)){const p=spawnPoint(10);const k=n>=9?3:2;for(let i=0;i<k;i++)spawnWraith(p.x+rand(-18,18),p.y+rand(-18,18));N.wraithT*=1.6;}else spawnWraith();}}
    if(N.ghostInt){N.ghostT-=dt;if(N.ghostT<=0){N.ghostT=N.ghostInt*rand(.75,1.3);spawnGhost();}}
    if(N.bottleAt>0&&N.t>=N.bottleAt){N.bottleAt=-1;spawnShip('garrafa');hint('bottle','Uma <b>garrafa</b> boia no mar. Traga-a até a ilha para ler a mensagem.',4500);}
    if(N.forceRaft&&N.t>7){N.forceRaft=false;spawnShip('balsa');}
    if(!demo){N.starT-=dt;if(N.starT<=0&&!N.star){N.starT=rand(18,34);const z=nightZ(),hw=W/2/z,hh=H/2/z;const sx=rand(-hw*.8,hw*.8),sy=rand(-hh*.75,-hh*.2);const dir=Math.random()<.5?1:-1;N.star={x:sx,y:sy,vx:dir*rand(70,110),vy:rand(30,60),life:2.6,max:2.6};hint('star','Uma <b>estrela cadente</b>! Toque nela para apanhar um presente.',3600);}}
  }
  if(N.star){N.star.x+=N.star.vx*dt;N.star.y+=N.star.vy*dt;N.star.life-=dt;if(N.star.life<=0)N.star=null;}
  // rochas
  for(const r of N.rocks){if(beamAt(r.x,r.y,false)>0)r.rev=1;else r.rev=Math.max(0,r.rev-dt/3.5);}
  // navios
  for(const s of N.ships){
    if(s.dead)continue;
    s.age+=dt;
    const d=Math.hypot(s.x,s.y)||1;
    if(s.type==='fantasma'){
      s.x+=Math.cos(s.h)*s.spd*dt;s.y+=Math.sin(s.h)*s.spd*dt;s.travel+=s.spd*dt;
      if(!demo&&beamAt(s.x,s.y,false)>0){s.burn+=dt;if(s.burn>0.45)ghostBurst(s);}else s.burn=Math.max(0,s.burn-dt*.6);
      if(s.travel>s.len+30)s.dead=true;
      continue;
    }
    const lit=beamAt(s.x,s.y,true)>0;s.lit=lit;
    if(lit){if(s.type==='ouro'){s.trust+=dt;if(s.trust>0.9)s.follow=.6;}else s.follow=.6;}
    s.follow-=dt;
    let vx,vy,spd,turn;
    if(s.follow>0){vx=-s.x/d;vy=-s.y/d;spd=s.spd*(1.3+0.1*st.up.intensidade);turn=2.7;}
    else{
      s.wander=clamp(s.wander+(Math.random()-.5)*3.2*dt,-1,1);
      const hh=s.h+s.wander*.9;
      const far=d>N.range*.9?.55*clamp((d-N.range*.9)/140,0,1):0;
      const bias=clamp(.12+N.bell+far,0,.9);
      vx=Math.cos(hh)*(1-bias)-s.x/d*bias;vy=Math.sin(hh)*(1-bias)-s.y/d*bias;
      spd=s.spd*.62;turn=.95;
    }
    if(s.type!=='garrafa'){
      for(const r of N.rocks){if(r.rev<=.05)continue;const dx=s.x-r.x,dy=s.y-r.y,dd=Math.hypot(dx,dy)||1;const R=r.r+s.size+28;
        if(dd<R){const ahead=(Math.cos(s.h)*-dx+Math.sin(s.h)*-dy)/dd;if(ahead>-.25){const w=(1-dd/R)*3.2*r.rev;vx+=dx/dd*w;vy+=dy/dd*w;}}}
    }
    s.h+=clamp(angDiff(s.h,Math.atan2(vy,vx)),-turn*dt,turn*dt);
    s.x+=Math.cos(s.h)*spd*dt+N.wind.x*dt;s.y+=Math.sin(s.h)*spd*dt+N.wind.y*dt;
    s.wakeT-=dt;if(s.wakeT<=0){s.wakeT=.13;addPart(s.x-Math.cos(s.h)*s.size*.8,s.y-Math.sin(s.h)*s.size*.8,0,0,1.3,'wake',s.size*.45);}
    if(s.type==='balsa'&&!demo){s.life-=dt;if(s.life<=0){wreck(s,null,'Náufragos perdidos…');continue;}}
    if(s.type!=='garrafa'){for(const r of N.rocks){if(Math.hypot(s.x-r.x,s.y-r.y)<r.r+s.size*.5){wreck(s,r);break;}}}
    if(s.dead)continue;
    if(Math.hypot(s.x,s.y)<IR*1.03)dock(s);
  }
  if(!demo&&N.ships.some(s=>s.lit&&!s.dead)&&N.t>2)hint('lit','Navios iluminados <b>seguem a luz</b> até o porto. No escuro, ficam à deriva.',4200);
  N.ships=N.ships.filter(s=>!s.dead);
  // névoas
  for(const w of N.wraiths){
    if(w.dead)continue;w.age+=dt;
    const d=Math.hypot(w.x,w.y)||1;const b=beamAt(w.x,w.y,false);
    let spd=w.spd*(b>0?.42:1)*Math.min(1,w.age/1.2);
    if(b>0){w.hp-=N.dps*dt*(.7+.3*b);w.burn=.15;if(Math.random()<dt*22)addPart(w.x+rand(-6,6),w.y+rand(-6,6),rand(-10,10),rand(-30,-10),.6,'spark','#ffcf8a',1.6);SFX.hiss();}
    w.burn=Math.max(0,w.burn-dt);
    const a=Math.atan2(-w.y,-w.x)+Math.sin(w.age*1.7+w.ph)*.55;
    w.x+=Math.cos(a)*spd*dt;w.y+=Math.sin(a)*spd*dt;
    if(Math.random()<dt*8)addPart(w.x+rand(-5,5),w.y+rand(-5,5),rand(-4,4),rand(-4,4),1,'smoke','#3a2a5c',3);
    if(w.hp<=0){killWraith(w);continue;}
    if(d<IR*.92){hitIsland(w);if(phase!=='night')return;continue;}
    for(const s of N.ships){if(s.dead||s.type==='fantasma')continue;if(Math.hypot(s.x-w.x,s.y-w.y)<s.size+8){wreck(s,null,'Engolido pela névoa!');}}
  }
  N.wraiths=N.wraiths.filter(w=>!w.dead);
  if(phase==='night'&&N.t>=N.dur)endNight();
  if(!demo&&phase==='night'&&N.t>1.2)hint('drag','<b>Arraste o dedo</b> pela tela para girar o feixe do farol.',4800);
  if(!demo&&phase==='night'&&N.flashCD<=0&&N.t>6)hint('flash','O <b>Lampejo</b> está pronto: toque no botão ou dê <b>dois toques</b> na tela. Ilumina tudo ao redor e queima névoas.',5200);
}
function updateFx(dt){
  for(const p of N.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;if(p.type==='debris'){p.vx*=.97;p.vy*=.97;}}
  N.parts=N.parts.filter(p=>p.life>0);
  for(const t of N.texts){t.life-=dt;t.y-=dt*16;}
  N.texts=N.texts.filter(t=>t.life>0);
  if(N.ev==='tempestade'&&phase==='night'){
    while(N.drops.length<90)N.drops.push({x:rand(0,W),y:rand(-H,0),v:rand(500,800)});
    for(const d of N.drops){d.y+=d.v*dt;d.x+=N.wind.x*6*dt-80*dt;if(d.y>H){d.y=rand(-60,0);d.x=rand(0,W+100);}}
  }
}

function contractStatus(){
  const c=N.contract;if(!c)return{done:false,txt:''};
  switch(c.id){
    case 'dock':return{done:N.docked>=c.goal,txt:`${Math.min(N.docked,c.goal)}/${c.goal}`};
    case 'kill':return{done:N.kills>=c.goal,txt:`${Math.min(N.kills,c.goal)}/${c.goal}`};
    case 'combo':return{done:N.maxCombo>=c.goal,txt:`melhor ×${N.maxCombo}`};
    case 'nolose':return{done:N.lost===0&&N.docked>=3,fail:N.lost>0,txt:N.lost?'falhou':'até agora, nenhum'};
    case 'rescue':return{done:N.raftSpawned>0&&N.raftLost===0&&N.ships.every(s=>s.type!=='balsa'),fail:N.raftLost>0,txt:N.raftLost?'falhou':`${N.ships.filter(s=>s.type==='balsa').length} à deriva`};
    case 'ghost':return{done:N.ghostLit===0,fail:N.ghostLit>0,txt:N.ghostLit?'falhou':'nenhum até agora'};
  }
  return{done:false,txt:''};
}
function contractLine(){
  const c=N.contract;if(!c)return'';const s=contractStatus();
  return `📜 ${c.t} · <span class="${s.done?'ok':s.fail?'bad':''}">${s.done?'✓ ':''}${s.txt}</span> · ${gainHTML(c.reward)}`;
}

function processDawn(){
  const act=activeMap();
  const r={night:S.night,docked:N.docked,lost:N.lost,kills:N.kills,gains:Object.assign({},N.gains),prod:{fish:0,gold:0},eat:0,notes:[],flame:0,story:N.story,contract:null};
  for(const k in S.grid){
    if(!act[k])continue;const b=S.grid[k];const[q,rr]=unkey(k);
    if(b.t==='rede')r.prod.fish+=2+(adjCount(S,q,rr,'cais')?1:0);
    if(b.t==='mercado')r.prod.gold+=2+Math.min(3,adjCount(S,q,rr,'casa'));
  }
  S.res.fish+=r.prod.fish;S.res.gold+=r.prod.gold;
  // contrato
  const cs=contractStatus();const c=N.contract;
  if(cs.done){for(const k in c.reward)S.res[k]+=c.reward[k];}
  r.contract={t:c.t,ok:cs.done,reward:c.reward};
  // alimentação
  const need=Math.ceil(S.pop/2);r.eat=need;
  if(S.res.fish>=need)S.res.fish-=need;
  else{const short=need-S.res.fish;S.res.fish=0;const leave=Math.min(S.pop,short*2);S.pop-=leave;r.notes.push(['😢 Partiram por fome',-leave]);}
  const h=housing();
  if(S.pop>h){const ex=S.pop-h;S.pop=h;r.notes.push(['🏚️ Partiram por falta de moradia',-ex]);}
  else if(S.pop<h&&S.res.fish>=2){const g=Math.min(h-S.pop,1+Math.floor(S.res.fish/10),Math.floor(S.res.fish/2));if(g>0){S.pop+=g;S.res.fish-=g*2;r.notes.push(['👶 Novos moradores',g]);}}
  const reg=Math.min(flameMax()-S.flame,10+3*countB('jardim'));S.flame+=Math.max(0,reg);r.flame=Math.max(0,Math.round(reg));
  S.stats.docked+=N.docked;S.stats.lost+=N.lost;S.stats.kills+=N.kills;S.stats.rescued+=N.rescued;
  meta.best=Math.max(meta.best,S.night);saveMeta();
  S.night++;rollNext();saveRun();
  return r;
}

function build(){
  const t=S.placing,p=S.pending;if(!t||!p)return;const c=costOf(t);
  if(!canAfford(c)||!validSpot(t,p.q,p.r)){SFX.bad();return;}
  pay(c);S.grid[p.k]={t,o:++S.order};
  const[x,y]=hexToWorld(p.q,p.r);fxBurst.push({x,y,t:0});
  SFX.build();vib(18);
  S.placing=null;S.pending=null;$('#confirmBar').classList.add('hidden');
  if(t==='santuario')S.flame+=15;
  renderPanel();saveRun();
  if(countB('casa')===1&&t==='casa')hint('houses','Casas ao lado de <b>Jardins</b> abrigam mais gente. Mercados ao lado de casas rendem mais ouro.',5000);
}

function openFarol(){

function islandPath(c,R,grow=0,seed=0){
  c.beginPath();
  for(let i=0;i<=72;i++){const a=i/72*TAU;const r=R*(1.05+.04*Math.sin(3*a+seed)+.03*Math.sin(5*a+seed*2)+.015*Math.sin(11*a+seed))+grow;
    const x=Math.cos(a)*r,y=Math.sin(a)*r;i?c.lineTo(x,y):c.moveTo(x,y);}
  c.closePath();
}

function drawSea(){

  g.addColorStop(0,mixc('#071a33','#3a9cbc',day));g.addColorStop(1,mixc('#020a18','#1b6c8e',day));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  const[x0,y0]=s2w(0,0),[x1,y1]=s2w(W,H);
  const cw=30,ch=22;const IR=IRof(ST());
  const P=[new Path2D(),new Path2D(),new Path2D()];
  for(let gy=Math.floor(y0/ch)-1;gy<=Math.ceil(y1/ch)+1;gy++)for(let gx=Math.floor(x0/cw)-1;gx<=Math.ceil(x1/cw)+1;gx++){
    const h=hash(gx,gy);const v=Math.sin(T*.9+h*TAU);if(v<0)continue;
    const x=gx*cw+h*cw*.8+Math.sin(T*.4+h*5)*3,y=gy*ch+((h*7.31)%1)*ch;
    if(x*x+y*y<IR*IR*1.25)continue;

  }

    const y0=-1-(i/bands)*(-top-1),y1=-1-((i+1)/bands)*(-top-1);
    const w0=hb+(ht-hb)*(i/bands),w1=hb+(ht-hb)*((i+1)/bands);
    ctx.fillStyle=i%2?'#c4453a':'#f3eee6';ctx.beginPath();ctx.moveTo(-w0,y0);ctx.lineTo(w0,y0);ctx.lineTo(w1,y1);ctx.lineTo(-w1,y1);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.14)';ctx.beginPath();ctx.moveTo(w0*.3,y0);ctx.lineTo(w0,y0);ctx.lineTo(w1,y1);ctx.lineTo(w1*.3,y1);ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='#3a3f48';ctx.fillRect(-5.4,top-1,10.8,1.8);
  const lit=nightAmt>.05||phase==='night';
  ctx.fillStyle=lit?'#fff1b8':'#bcd8e6';ctx.fillRect(-3,top-6,6,5);
  ctx.strokeStyle='#3a3f48';ctx.lineWidth=.5;ctx.strokeRect(-3,top-6,6,5);ctx.beginPath();ctx.moveTo(0,top-6);ctx.lineTo(0,top-1);ctx.stroke();
  ctx.fillStyle='#7c2a22';ctx.beginPath();ctx.arc(0,top-6,3.6,Math.PI,0);ctx.fill();ctx.fillRect(-.5,top-11.5,1,2.5);
}
function drawIsland(st,alpha=1){
  const IR=IRof(st);const seed=st.seed||0;
  ctx.save();ctx.globalAlpha=alpha;
  islandPath(ctx,IR,4+Math.sin(T*1.2)*1.4,seed);ctx.fillStyle='rgba(225,240,255,.28)';ctx.fill();
  islandPath(ctx,IR,1.5,seed);ctx.fillStyle='#c9ad74';ctx.fill();
  islandPath(ctx,IR,0,seed);ctx.fillStyle='#dcc38a';ctx.fill();
  islandPath(ctx,IR*.86,0,seed);ctx.fillStyle='#6a9a52';ctx.fill();
  // hexágonos
  const hx=allHexes(st.gridR);
  for(const[q,r]of hx){
    const[x,y]=hexToWorld(q,r);const d=hexDist(q,r);const h=hash(q*3.1,r*7.7);
    hexPath(ctx,x,y,HS*.97);
    ctx.fillStyle=d===st.gridR?(h>.5?'#e3cd94':'#dcc387'):(h>.66?'#78ab5c':h>.33?'#71a356':'#7cb162');
    ctx.fill();
    ctx.strokeStyle='rgba(60,40,10,.12)';ctx.lineWidth=.6;ctx.stroke();
    if(d!==st.gridR&&h>.82&&!st.grid[key(q,r)]){ctx.fillStyle='#5f8f47';ctx.beginPath();ctx.arc(x+3,y+2,1.4,0,TAU);ctx.arc(x-3,y-1,1.1,0,TAU);ctx.fill();}
  }
  // prédios em ordem de profundidade
  const act=activeMap(st);
  const list=Object.keys(st.grid).map(k=>{const[q,r]=unkey(k);const[x,y]=hexToWorld(q,r);return{k,t:st.grid[k].t,x,y};}).sort((a,b)=>a.y-b.y);
  for(const b of list){if(b.t==='farol'){ctx.save();drawLighthouse();ctx.restore();}else drawBuilding(ctx,b.t,b.x,b.y,act[b.k]!==false);}
  ctx.restore();
}
function coneOut(c,ox,oy,a,half,range,alpha){
  const g=c.createRadialGradient(ox,oy,0,ox,oy,range);
  g.addColorStop(0,`rgba(0,0,0,${alpha})`);g.addColorStop(.7,`rgba(0,0,0,${alpha*.85})`);g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g;c.beginPath();c.moveTo(ox,oy);c.arc(ox,oy,range,a-half,a+half);c.closePath();c.fill();
}
function drawMask(){
  const dark=(N?N.dark:.93);
  const a=clamp(dark*nightAmt*(1-(N?N.light:0)*.8)+(N?N.dying:0),0,1);
  if(a<.01)return;
  mctx.setTransform(1,0,0,1,0,0);mctx.globalCompositeOperation='source-over';
  mctx.clearRect(0,0,mask.width,mask.height);mctx.fillStyle=`rgba(2,5,14,${a})`;mctx.fillRect(0,0,mask.width,mask.height);
  mctx.globalCompositeOperation='destination-out';
  setWorld(mctx,MS);
  const st=ST();const IR=IRof(st);
  const lifeK=N&&phase==='over'?Math.max(0,1-N.dying*1.5):1;
  {const g=mctx.createRadialGradient(0,-6,0,0,-6,IR*1.55);g.addColorStop(0,`rgba(0,0,0,${.93*lifeK})`);g.addColorStop(.62,`rgba(0,0,0,${.72*lifeK})`);g.addColorStop(1,'rgba(0,0,0,0)');mctx.fillStyle=g;mctx.beginPath();mctx.arc(0,-6,IR*1.55,0,TAU);mctx.fill();}
  if(N&&lifeK>0){
    const k=(phase==='night'||phase==='menu')?1:nightAmt;
    coneOut(mctx,0,OY,N.beamA,N.half*1.35,N.range*1.04,.35*k*lifeK);
    coneOut(mctx,0,OY,N.beamA,N.half,N.range,.75*k*lifeK);
    coneOut(mctx,0,OY,N.beamA,N.half*.55,N.range*.95,.5*k*lifeK);
    for(const m of N.mirrors){coneOut(mctx,m.x,m.y,m.a,m.half*1.3,m.range,.3*k);coneOut(mctx,m.x,m.y,m.a,m.half,m.range,.6*k);}
    if(N.flashT>0){const p=1-N.flashT/.5;const R=N.flashR*Math.min(1,p*3+.2);const g=mctx.createRadialGradient(0,0,0,0,0,R);g.addColorStop(0,`rgba(0,0,0,${.95*(1-p*.6)})`);g.addColorStop(1,'rgba(0,0,0,0)');mctx.fillStyle=g;mctx.beginPath();mctx.arc(0,0,R,0,TAU);mctx.fill();}
    for(const s of N.ships){if(s.type==='fantasma')continue;const g=mctx.createRadialGradient(s.x,s.y,0,s.x,s.y,18);g.addColorStop(0,`rgba(0,0,0,${.58*Math.min(1,s.age)})`);g.addColorStop(1,'rgba(0,0,0,0)');mctx.fillStyle=g;mctx.beginPath();mctx.arc(s.x,s.y,18,0,TAU);mctx.fill();}
  }
  setScreen();ctx.drawImage(mask,0,0,W,H);
}
function drawBeamGlow(){
  if(!N||nightAmt<.05)return;
  setWorld();ctx.save();ctx.globalCompositeOperation='lighter';
  const k=nightAmt*(phase==='over'?Math.max(0,1-N.dying*1.5):1);
  const g=ctx.createRadialGradient(0,OY,0,0,OY,N.range);g.addColorStop(0,`rgba(255,215,140,${.3*k})`);g.addColorStop(1,'rgba(255,215,140,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,OY);ctx.arc(0,OY,N.range,N.beamA-N.half,N.beamA+N.half);ctx.closePath();ctx.fill();
  for(const m of N.mirrors){const g2=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.range);g2.addColorStop(0,`rgba(190,235,255,${.2*k})`);g2.addColorStop(1,'rgba(190,235,255,0)');ctx.fillStyle=g2;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.arc(m.x,m.y,m.range,m.a-m.half,m.a+m.half);ctx.closePath();ctx.fill();}
  const lg=ctx.createRadialGradient(0,OY,0,0,OY,22);lg.addColorStop(0,`rgba(255,240,190,${.9*k})`);lg.addColorStop(.3,`rgba(255,200,110,${.35*k})`);lg.addColorStop(1,'rgba(255,200,110,0)');
  ctx.fillStyle=lg;ctx.beginPath();ctx.arc(0,OY,22,0,TAU);ctx.fill();
  if(N.flashT>0){const p=1-N.flashT/.5;ctx.strokeStyle=`rgba(255,235,180,${(1-p)*.8})`;ctx.lineWidth=3/cam.z;ctx.beginPath();ctx.arc(0,0,N.flashR*Math.min(1,p*1.4),0,TAU);ctx.stroke();}
  ctx.restore();
}
function drawOverlays(){
  if(!N)return;setWorld();
  const fade=(phase==='night'||phase==='menu'||phase==='over')?1:nightAmt;
  const px=1/cam.z;
  // memória das rochas
  for(const r of N.rocks){if(r.rev<=.02)continue;ctx.save();ctx.translate(r.x,r.y);ctx.globalAlpha=r.rev*.5*fade;ctx.strokeStyle='#ffc38a';ctx.lineWidth=1.2*px;ctx.setLineDash([3*px,3*px]);
    ctx.beginPath();r.pts.forEach(([x,y],i)=>i?ctx.lineTo(x*1.15,y*1.15):ctx.moveTo(x*1.15,y*1.15));ctx.closePath();ctx.stroke();ctx.restore();}
  // lanternas
  for(const s of N.ships){
    if(s.type==='fantasma'){ctx.save();ctx.globalAlpha=Math.min(1,s.age)*fade;drawGhost(s);ctx.restore();continue;}
    let a=Math.min(1,s.age/1.2)*fade;if(N.ev==='neblina'&&Math.hypot(s.x,s.y)>170)a*=.12;
    const col=s.type==='garrafa'?'160,255,200':s.type==='balsa'?'150,220,255':s.type==='ouro'?'255,215,90':'255,205,120';
    const tw=.75+.25*Math.sin(T*7+s.bob);
    ctx.save();ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,9*px+4);g.addColorStop(0,`rgba(${col},${.9*a*tw})`);g.addColorStop(1,`rgba(${col},0)`);
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(s.x,s.y,9*px+4,0,TAU);ctx.fill();ctx.restore();
    ctx.fillStyle=`rgba(255,250,230,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,2.1*px,0,TAU);ctx.fill();
    if(s.type==='balsa'&&!N.demo&&phase==='night'){const f=s.life/s.maxLife;ctx.strokeStyle=f>.5?'#86e3a6':f>.25?'#ffd36b':'#ff6f5e';ctx.lineWidth=2*px;ctx.beginPath();ctx.arc(s.x,s.y,12,-Math.PI/2,-Math.PI/2+TAU*f);ctx.stroke();}
    if(s.type==='ouro'&&s.trust<.9&&s.lit){ctx.strokeStyle='rgba(255,215,90,.9)';ctx.lineWidth=2*px;ctx.beginPath();ctx.arc(s.x,s.y,13,-Math.PI/2,-Math.PI/2+TAU*s.trust/.9);ctx.stroke();}
  }
  for(const w of N.wraiths){ctx.save();ctx.globalAlpha=fade;drawWraith(w);ctx.restore();}
  // partículas acima da máscara
  ctx.save();
  for(const p of N.parts){
    if(p.type==='wake')continue;const k=p.life/p.max;
    if(p.type==='spark'){ctx.globalCompositeOperation='lighter';ctx.fillStyle=p.col;ctx.globalAlpha=k*fade;ctx.beginPath();ctx.arc(p.x,p.y,p.size*k+.3,0,TAU);ctx.fill();}
    else if(p.type==='smoke'){ctx.globalCompositeOperation='source-over';ctx.fillStyle=p.col;ctx.globalAlpha=k*.55*fade;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1.6-k),0,TAU);ctx.fill();}
    else{ctx.globalCompositeOperation='source-over';ctx.fillStyle=p.col;ctx.globalAlpha=k*fade;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);}
  }
  ctx.restore();
  if(N.star){const s=N.star;const k=Math.min(1,s.life/s.max*2);ctx.save();ctx.globalCompositeOperation='lighter';const L=Math.hypot(s.vx,s.vy);const tx=s.x-s.vx/L*50,ty=s.y-s.vy/L*50;
    const g=ctx.createLinearGradient(tx,ty,s.x,s.y);g.addColorStop(0,'rgba(255,245,200,0)');g.addColorStop(1,`rgba(255,245,200,${k})`);ctx.strokeStyle=g;ctx.lineWidth=2.4*px;ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(s.x,s.y);ctx.stroke();
    const sg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,14*px+6);sg.addColorStop(0,`rgba(255,250,220,${k})`);sg.addColorStop(1,'rgba(255,250,220,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(s.x,s.y,14*px+6,0,TAU);ctx.fill();ctx.restore();}
  // textos
  setScreen();ctx.textAlign='center';ctx.textBaseline='middle';
  for(const t of N.texts){const[x,y]=w2s(t.x,t.y);const k=t.life/t.max;ctx.globalAlpha=Math.min(1,k*2.5);ctx.font=`900 ${t.size}px Nunito, sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.7)';ctx.strokeText(t.txt,x,y);ctx.fillStyle=t.col;ctx.fillText(t.txt,x,y);}
  ctx.globalAlpha=1;
  if(N.ev==='tempestade'&&phase==='night'){ctx.strokeStyle='rgba(170,200,255,.35)';ctx.lineWidth=1;ctx.beginPath();for(const d of N.drops){ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-6,d.y+14);}ctx.stroke();
    if(N.light>0){ctx.fillStyle=`rgba(220,230,255,${N.light*.25})`;ctx.fillRect(0,0,W,H);}}
}
function drawPlacement(){
  if(phase!=='day'||!S||!S.placing)return;setWorld();
  const pulse=.5+.5*Math.sin(T*5);
  for(const[q,r]of allHexes(S.gridR)){
    if(!validSpot(S.placing,q,r))continue;const[x,y]=hexToWorld(q,r);
    hexPath(ctx,x,y,HS*.9);ctx.fillStyle=`rgba(255,215,120,${.12+.12*pulse})`;ctx.fill();ctx.strokeStyle=`rgba(255,225,150,${.5+.4*pulse})`;ctx.lineWidth=1.2/cam.z*1.6;ctx.stroke();
  }
  if(S.pending){const[x,y]=hexToWorld(S.pending.q,S.pending.r);hexPath(ctx,x,y,HS*.95);ctx.fillStyle='rgba(255,230,160,.35)';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2/cam.z*1.6;ctx.stroke();drawBuilding(ctx,S.placing,x,y,true,.75+.25*pulse);}
}
function drawBuildFx(dt){
  if(!fxBurst.length)return;setWorld();
  for(const f of fxBurst){f.t+=dt;const k=f.t/0.7;ctx.strokeStyle=`rgba(255,230,160,${1-k})`;ctx.lineWidth=2/cam.z*1.5;ctx.beginPath();ctx.arc(f.x,f.y-4,4+k*18,0,TAU);ctx.stroke();
    for(let i=0;i<8;i++){const a=i/8*TAU+f.t;ctx.fillStyle=`rgba(255,240,190,${1-k})`;ctx.beginPath();ctx.arc(f.x+Math.cos(a)*k*16,f.y-4+Math.sin(a)*k*12-k*6,1.2,0,TAU);ctx.fill();}}
  for(let i=fxBurst.length-1;i>=0;i--)if(fxBurst[i].t>.7)fxBurst.splice(i,1);
}
function drawVignette(){
  setScreen();
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,8,${.25+.3*nightAmt})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(N&&N.hurt>0){const h=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.7);h.addColorStop(0,'rgba(255,40,30,0)');h.addColorStop(1,`rgba(255,40,30,${N.hurt*.45})`);ctx.fillStyle=h;ctx.fillRect(0,0,W,H);}
  if(phase==='over'&&N){ctx.fillStyle=`rgba(0,0,0,${Math.min(.6,N.dying*.5)})`;ctx.fillRect(0,0,W,H);}
}
function render(dt){
  shakeX=shakeY=0;if(N&&N.shake>0){shakeX=rand(-1,1)*N.shake;shakeY=rand(-1,1)*N.shake;}
  drawSea();
  setWorld();
  const st=ST();
  if(N){
    const fade=(phase==='night'||phase==='menu'||phase==='over')?1:nightAmt;
    for(const p of N.parts){if(p.type!=='wake')continue;const k=p.life/p.max;ctx.strokeStyle=`rgba(220,240,255,${k*.35*fade})`;ctx.lineWidth=.9;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(2-k)*1.4,0,TAU);ctx.stroke();}
    for(const r of N.rocks)drawRock(r,fade);
    for(const s of N.ships)if(s.type!=='fantasma')drawShip(s,Math.min(1,s.age/1.2)*fade);
  }
  drawIsland(st);
  drawMask();
  drawBeamGlow();
  drawOverlays();
  drawPlacement();
  drawBuildFx(dt);
  drawVignette();
}

// =====================================================================
//  Laço principal
// =====================================================================
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
  step(dt);
  render(dt);
  requestAnimationFrame(frame);
}
function step(dt){
  const paused=modalOpen&&phase==='night';
  if(!paused)T+=dt;
  const tgt=(phase==='night'||phase==='menu'||phase==='over')?1:0;
  nightAmt+=(tgt-nightAmt)*(1-Math.exp(-dt*(tgt?1.8:1.3)));
  const tc=(phase==='day'||phase==='dawn')?dayCam():nightCam();
  const k=1-Math.exp(-dt*2.6);cam.x+=(tc.x-cam.x)*k;cam.y+=(tc.y-cam.y)*k;cam.z+=(tc.z-cam.z)*k;
  if(N&&!paused){
    if(phase==='night'||phase==='menu')updateNight(dt);
    else if(phase==='over'){N.dying=Math.min(1.2,N.dying+dt*.5);N.shake=Math.max(0,N.shake-dt*30);}
    if(N)updateFx(dt);
  }
  if(N&&(phase==='day')&&nightAmt<.02)N=null;
  SFX.music(dt,nightAmt>.5);
  updateHUD();
}

// API para testes automatizados
window.__lume={get input(){return input;},get S(){return S;},get N(){return N;},get phase(){return phase;},step,startNewRun,startNight,endNight,openDusk,doFlash,build:(t,q,r)=>{S.placing=t;S.pending={q,r,k:key(q,r)};build();},closeModal};

resize();
startDemo();
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
