name: Proteger HUB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '_hub/**'
      - '_ferramentas/proteger-hub.mjs'
      - '.github/workflows/proteger_hub.yml'

permissions:
  contents: write

concurrency:
  group: proteger-hub
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cifrar as páginas do HUB
        env:
          HUB_SENHA: ${{ secrets.HUB_SENHA }}
          HUB_DATAJUD_URL: ${{ vars.HUB_DATAJUD_URL }}
          HUB_DATAJUD_TOKEN: ${{ secrets.HUB_DATAJUD_TOKEN }}
          HUB_OUTLOOK_CLIENT_ID: ${{ vars.HUB_OUTLOOK_CLIENT_ID }}
          HUB_OUTLOOK_TENANT: ${{ vars.HUB_OUTLOOK_TENANT }}
          HUB_SHERLOCK_URL: ${{ vars.HUB_SHERLOCK_URL }}
          HUB_SHERLOCK_TOKEN: ${{ secrets.HUB_SHERLOCK_TOKEN }}
        run: |
          if [ -z "$HUB_SENHA" ]; then
            echo "::error::Cadastre a senha do HUB no segredo HUB_SENHA (Settings > Secrets and variables > Actions) e execute este fluxo novamente."
            exit 1
          fi
          node _ferramentas/proteger-hub.mjs

      - name: Publicar a versão protegida
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A hub
          if git diff --cached --quiet; then echo "Sem alterações a publicar."; exit 0; fi
          git commit -m "HUB: publicação protegida"
          git push
