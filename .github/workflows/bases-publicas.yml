# Bases públicas do HUB: Registro Aeronáutico Brasileiro (ANAC), para a Investigação patrimonial, e o acervo de
# jurisprudência e legislação do projeto Advocacia Aberta, para a Pesquisa de jurisprudência, e as tabelas oficiais da
# Calculadora de Tributos da Reforma Tributária (Receita Federal), para a ferramenta de Reforma tributária.
# Baixa os dados abertos, cifra com a chave do HUB e publica no ramo "bases-publicas". Roda diariamente e quando o
# script muda.
name: Bases públicas do HUB

on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'   # 06:23 em Brasília
  push:
    branches: [main]
    paths:
      - '_ferramentas/bases/**'
      - '_ferramentas/rtc/exportar.py'
      - '.github/workflows/bases-publicas.yml'

permissions:
  contents: write

concurrency:
  group: bases-publicas
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar as bases cifradas
        env:
          HUB_SENHA: ${{ secrets.HUB_SENHA }}
        run: |
          if [ -z "$HUB_SENHA" ]; then
            echo "::error::Cadastre a senha do HUB no segredo HUB_SENHA."
            exit 1
          fi
          node _ferramentas/bases/publicas.mjs
      - name: Baixar o acervo aberto do Advocacia Aberta
        run: git clone -q --depth 1 https://github.com/emidio-trancoso/advocacia-aberta.git /tmp/advocacia-aberta
      - name: Gerar a base de jurisprudência
        env:
          HUB_SENHA: ${{ secrets.HUB_SENHA }}
        run: node _ferramentas/bases/juris.mjs /tmp/advocacia-aberta
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Gerar as tabelas oficiais da Reforma Tributária (Receita Federal)
        run: |
          git clone -q --depth 1 https://github.com/ReceitaFederal/calculadora-rtc-regime-regular.git /tmp/rtc
          cd /tmp/rtc
          mkdir -p calculadora/db
          ./mvnw -q flyway:migrate -Dflyway.configFiles=./flyway/flyway-pro.conf --batch-mode --errors
          cd "$GITHUB_WORKSPACE"
          python3 -I _ferramentas/rtc/exportar.py /tmp/rtc/calculadora/db/calculadora-pro.db base-publica/rtc.json.gz
      - name: Publicar no ramo bases-publicas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd base-publica
          git init -q -b bases-publicas
          git add -A
          git -c user.name="HUB TPC" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Bases públicas do HUB"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bases-publicas
