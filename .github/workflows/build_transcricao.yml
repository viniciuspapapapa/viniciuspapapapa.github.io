name: Build Transcricao.exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'transcricao.py'
      - 'transcricao.html'
      - '.github/workflows/build_transcricao.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pywebview flask faster-whisper scikit-learn opencv-python-headless pytesseract pyinstaller

      - name: Build executable
        run: |
          pyinstaller `
            --onefile `
            --noconsole `
            --name "Transcricao" `
            --add-data "transcricao.html;." `
            --hidden-import "faster_whisper" `
            --hidden-import "ctranslate2" `
            --hidden-import "tokenizers" `
            --hidden-import "huggingface_hub" `
            --hidden-import "scipy.io.wavfile" `
            --hidden-import "scipy.signal" `
            --hidden-import "sklearn.cluster" `
            --hidden-import "sklearn.preprocessing" `
            --collect-all "faster_whisper" `
            --collect-all "sklearn" `
            transcricao.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Transcricao-Windows
          path: dist/Transcricao.exe
          retention-days: 30

      - name: Publish release asset (download link used by the HUB)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view transcricao >/dev/null 2>&1; then
            gh release create transcricao --target "${{ github.sha }}" --title "Degravação de audiências (Windows)" --notes "Executável para Windows da ferramenta de degravação de audiências do HUB Criminal TPC. Na primeira execução, o modelo de transcrição é baixado automaticamente (cerca de 1,5 GB)."
          fi
          gh release upload transcricao dist/Transcricao.exe --clobber
