<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Acesso · HUB Criminal TPC</title>
<meta name="theme-color" content="#f5f1e8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600&family=Red+Hat+Text:wght@400;500;600&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Hallmark · checked: 2026-11-09 · genre: modern-minimal · theme: Furrow (by request) · shape: app screen · modes: light+dark · built: the project · redesign: restyle · v2.0.0 */
  :root { --paper: oklch(96% 0.011 85); --surface: oklch(99.5% 0.005 85); --ink: oklch(18% 0.006 60); --ink-2: oklch(31% 0.008 60); --ink-3: oklch(46% 0.012 60); --line: oklch(88% 0.013 85); --line-2: oklch(76% 0.016 85); --accent: oklch(70% 0.19 40); --accent-ink: oklch(18% 0.006 60); --focus: oklch(60% 0.19 40); --bad: oklch(47% 0.16 28);
    --shadow-lift: 0 1px 1px oklch(18% 0.006 60 / 0.1), 0 2px 4px -1px oklch(18% 0.006 60 / 0.1), 0 24px 44px -20px oklch(18% 0.006 60 / 0.42); --key-lit-acc: inset 0 1px 0 oklch(100% 0 0 / 0.32), inset 0 -1px 0 oklch(18% 0.006 60 / 0.1), 0 1px 2px oklch(18% 0.006 60 / 0.14);
    --serif: "Red Hat Display", "Red Hat Text", ui-sans-serif, system-ui, sans-serif; --sans: "Red Hat Text", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: oklch(16% 0.011 85); --surface: oklch(20% 0.011 85); --ink: oklch(94% 0.01 85); --ink-2: oklch(84% 0.011 85); --ink-3: oklch(70% 0.013 85); --line: oklch(30% 0.012 85); --line-2: oklch(42% 0.014 85); --accent: oklch(76% 0.16 42); --focus: oklch(76% 0.16 42); --bad: oklch(78% 0.12 28); --shadow-lift: 0 0 0 1px var(--line-2); color-scheme: dark; } }
  :root[data-theme="dark"] { --paper: oklch(16% 0.011 85); --surface: oklch(20% 0.011 85); --ink: oklch(94% 0.01 85); --ink-2: oklch(84% 0.011 85); --ink-3: oklch(70% 0.013 85); --line: oklch(30% 0.012 85); --line-2: oklch(42% 0.014 85); --accent: oklch(76% 0.16 42); --focus: oklch(76% 0.16 42); --bad: oklch(78% 0.12 28); --shadow-lift: 0 0 0 1px var(--line-2); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow-x: clip; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; display: grid; grid-template-rows: 5px 1fr auto; font-synthesis: none; -webkit-font-smoothing: antialiased; }
  .faixa { border-top: 1px solid var(--ink); border-bottom: 1px solid color-mix(in oklab, var(--ink) 25%, transparent); }
  main { display: grid; place-items: center; padding: 32px 16px; }
  .caixa { width: min(420px, 100%); background: var(--surface); border: 0; border-radius: 14px; padding: 34px 28px 28px; box-shadow: 0 0 0 1px var(--ink), var(--shadow-lift); }
  .marca { display: flex; align-items: center; gap: 10px; color: var(--ink); margin-bottom: 28px; }
  .marca-tpc { border: 1px solid var(--ink); border-radius: 6px; padding: 3px 8px; font-family: var(--serif); font-weight: 600; letter-spacing: .04em; font-size: 14px; }
  .marca-txt { font-family: var(--serif); font-size: 17px; letter-spacing: -.02em; }
  .marca-txt b { font-weight: 600; }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 36px; line-height: 1; letter-spacing: -.035em; margin: 0 0 10px; }
  p.sub { margin: 0 0 22px; color: var(--ink-2); font-size: 15px; }
  label { display: grid; gap: 2px; font-size: 12.5px; color: var(--ink-3); font-weight: 500; background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 11px 5px; }
  label:focus-within { border-color: var(--ink); outline: 2px solid var(--focus); outline-offset: 1px; }
  input[type=password] { width: 100%; border: 0; background: transparent; color: var(--ink); padding: 2px 0 3px; min-height: 28px; font: inherit; font-size: 16px; outline: none; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .lembrar { display: flex; gap: 9px; align-items: center; margin: 14px 0 18px; font-size: 15px; color: var(--ink-2); cursor: pointer; background: none; border: 0; padding: 0; }
  .lembrar:focus-within { outline: none; }
  button { width: 100%; min-height: 48px; border: 1px solid color-mix(in oklab, var(--accent) 78%, var(--ink)); background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0 16px; font: inherit; font-weight: 500; cursor: pointer; box-shadow: var(--key-lit-acc); transition: background-color 220ms cubic-bezier(.22, 1, .36, 1), transform 120ms cubic-bezier(.22, 1, .36, 1); }
  button:hover { border-color: var(--ink); background: color-mix(in oklab, var(--accent) 90%, var(--ink)); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: progress; }
  .erro { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 10px; }
  footer { text-align: center; color: var(--ink-3); font-size: 14px; padding: 0 16px 22px; }
  footer b { font-weight: 600; color: var(--ink); font-family: var(--serif); }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<div class="faixa"></div>
<main>
  <form class="caixa" id="form" autocomplete="on">
    <div class="marca"><span class="marca-tpc">TPC</span><span class="marca-txt"><b>HUB</b> Criminal</span></div>
    <h1>Acesso restrito</h1>
    <p class="sub">Ferramentas de uso interno da equipe criminal. Informe a senha do escritório para continuar.</p>
    <input type="text" name="username" value="HUB Criminal TPC" autocomplete="username" hidden>
    <label>Senha<input type="password" id="senha" name="password" autocomplete="current-password" required autofocus></label>
    <label class="lembrar"><input type="checkbox" id="lembrar"> Manter conectado neste dispositivo por 30 dias</label>
    <button type="submit" id="entrar">Entrar</button>
    <div class="erro" id="erro" role="alert"></div>
  </form>
</main>
<footer><b>TPC ADVOGADOS</b> · HUB Criminal. As páginas do HUB são publicadas criptografadas e só podem ser abertas com a senha.</footer>
<script>
(function () {
  "use strict";
  try { const t = localStorage.getItem("hub_tema"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) { /* ignora */ }
  const $ = s => document.getElementById(s);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const para64 = u => { let s = ""; const a = new Uint8Array(u); for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
  function destino() {
    const v = new URLSearchParams(location.search).get("volta") || "";
    return /^\/hub\/(?!login\/)[\w\-\/.%]*([?#].*)?$/.test(v) ? v : "/hub/";
  }
  async function entrar(senha) {
    const r = await fetch("/hub/acesso.json", { cache: "no-store" });
    if (!r.ok) throw new Error("Configuração de acesso indisponível.");
    const cfg = await r.json();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
    const chave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(cfg.sal), iterations: cfg.iteracoes, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
    const v = b64(cfg.verificador);
    try { await crypto.subtle.decrypt({ name: "AES-GCM", iv: v.slice(0, 12) }, chave, v.slice(12)); } catch (e) { return null; }
    return para64(await crypto.subtle.exportKey("raw", chave));
  }
  $("form").addEventListener("submit", async ev => {
    ev.preventDefault();
    const senha = $("senha").value; if (!senha) return;
    $("entrar").disabled = true; $("erro").textContent = ""; $("entrar").textContent = "Verificando…";
    try {
      const k = await entrar(senha);
      if (!k) { $("erro").textContent = "Senha incorreta."; $("senha").select(); return; }
      sessionStorage.setItem("hub_chave", k);
      if ($("lembrar").checked) localStorage.setItem("hub_chave", JSON.stringify({ k, ate: Date.now() + 30 * 864e5 }));
      else localStorage.removeItem("hub_chave");
      location.replace(destino());
    } catch (e) { $("erro").textContent = e.message || "Não foi possível entrar."; }
    finally { $("entrar").disabled = false; $("entrar").textContent = "Entrar"; }
  });
})();
</script>
</body>
</html>
