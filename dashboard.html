/* =========================================================
   IMPORTAR / EXPORTAR TAREFAS (Excel / CSV)
   ========================================================= */
const TIMP_FIELDS = [
  ['title', 'Tarefa / título *'], ['clientName', 'Cliente'], ['processNumber', 'Nº do processo'],
  ['dueDate', 'Prazo fatal'], ['internalDate', 'Meta interna'], ['startDate', 'Data de início'],
  ['category', 'Categoria'], ['status', 'Status'], ['priority', 'Prioridade'],
  ['responsible', 'Responsável'], ['counterpart', 'Contraparte'], ['court', 'Vara / Tribunal'],
  ['description', 'Descrição'], ['nextStep', 'Próximo passo'], ['tags', 'Etiquetas'], ['observations', 'Observações']
];
/* Palavras reconhecidas nos cabeçalhos da planilha (ordem = prioridade) */
const TIMP_GUESS = [
  ['nextStep', /proximo passo|proxima (acao|etapa|providencia)/],
  ['internalDate', /meta|prazo interno|prazo de seguranca|data interna/],
  ['counterpart', /contraparte|parte contraria|parte adversa|adverso/],
  ['title', /^(tarefa|titulo|atividade|assunto|providencia|compromisso|evento|acao|servico|tipo de servico|descricao da tarefa|tarefa \/ titulo)$/],
  ['title', /tarefa|titulo|atividade|assunto|providencia|compromisso|servico/],
  ['processNumber', /processo|autos|cnj|inquerito|ipl|n[ºo°]\s*proc/],
  ['dueDate', /prazo fatal|fatal|vencimento|data limite|prazo final|data final|^prazo$|prazo/],
  ['startDate', /inicio|abertura|cadastr|criacao|distribuicao/],
  ['clientName', /cliente|constituinte|outorgante|^parte$|^nome/],
  ['category', /categoria|^tipo|natureza/],
  ['status', /status|situacao|estado/],
  ['priority', /prioridade|urgencia/],
  ['responsible', /responsavel|advogado|executante|colaborador|encarregado|usuario/],
  ['court', /vara|tribunal|orgao|juizo|comarca|foro|delegacia/],
  ['description', /descricao|detalhe|historico|texto|conteudo/],
  ['tags', /etiqueta|tag|marcador/],
  ['observations', /observac|^obs|nota|comentario/],
  ['dueDate', /^data$|^dia$|data/]
];
let timp = null;
function colLetter(i){ let s = ''; i++; while(i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function guessMap(header){
  const map = {}; TIMP_FIELDS.forEach(([f]) => { map[f] = -1; });
  const used = new Set(), H = header.map(h => norm(h).trim());
  TIMP_GUESS.forEach(([f, re]) => { if(map[f] >= 0) return; const i = H.findIndex((h, idx) => h && !used.has(idx) && re.test(h)); if(i >= 0){ map[f] = i; used.add(i); } });
  return map;
}
function findHeaderRow(rows){
  let best = 0, bestScore = -1;
  rows.slice(0, 15).forEach((r, i) => {
    const cells = r.map(c => norm(c)).filter(Boolean); if(cells.length < 2) return;
    const sc = cells.filter(h => TIMP_GUESS.some(([, re]) => re.test(h))).length * 3 + (cells.every(c => isNaN(Number(c))) ? 1 : 0);
    if(sc > bestScore){ bestScore = sc; best = i; }
  });
  return best;
}
function validISO(iso){ const d = parseISO(iso); return d && isoDate(d) === iso ? iso : ''; }
function parseAnyDate(v){
  if(v == null || v === '') return '';
  if(v instanceof Date && !isNaN(v)) return isoDate(v);
  if(typeof v === 'number'){
    if(v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * MS_DAY)); return validISO(d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate())); }
    return '';
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){ let y = +m[3]; if(y < 100) y += 2000; return validISO(y + '-' + pad(+m[2]) + '-' + pad(+m[1])); }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return validISO(m[1] + '-' + pad(+m[2]) + '-' + pad(+m[3]));
  if(/^\d{5}(\.\d+)?$/.test(s)) return parseAnyDate(Number(s));
  return '';
}
function mapCategory(v, def){
  const n = norm(v); if(!n) return def;
  const exact = Object.keys(CATS).find(k => norm(CATS[k].label) === n || norm(CATS[k].plural) === n || norm(CATS[k].short) === n || k === n);
  if(exact) return exact;
  if(/contato|ligac|retorno ao cliente|falar com/.test(n)) return 'contact';
  if(/atualiz|acompanh|consulta processual|andamento processual/.test(n)) return 'update';
  if(/judic|processual|audien|recurso|peticao|juizo|forum|manifestac|memoria|alegac|habeas|resposta a acusacao/.test(n)) return 'judicial';
  if(/intern/.test(n)) return 'internal';
  if(/admin|financ|cobranc|contrato|honorar/.test(n)) return 'admin';
  if(/prospec|venda|comercial|proposta|captac/.test(n)) return 'prospecting';
  return def;
}
function mapStatus(v, def){
  const n = norm(v); if(!n) return def;
  if(/conclu|finaliz|cumpri|baixad|encerrad|realizad|feito|^ok$|entregue|protocolad/.test(n)) return 'completed';
  if(/aguard|suspens|sobrestad|espera/.test(n)) return 'waiting';
  if(/andamento|execu|iniciad|fazendo/.test(n)) return 'in_progress';
  if(/urgen/.test(n)) return 'urgent';
  if(/pendente|aberto|a fazer|nao iniciad/.test(n)) return 'pending';
  return def;
}
function mapPriority(v){ const n = norm(v); if(/urgen|critic|maxima/.test(n)) return 'urgent'; if(/alta|high|importante/.test(n)) return 'high'; if(/baixa|low/.test(n)) return 'low'; return 'medium'; }
function timpKey(t){ return norm(t.title) + '|' + norm(t.processNumber) + '|' + (t.dueDate || ''); }
function cellTxt(v){ if(v == null) return ''; if(v instanceof Date) return isoDate(v); return String(v).replace(/\s+/g, ' ').trim(); }
function timpBuild(){
  const { rows, headerIdx, map, defaults } = timp;
  const get = (r, f) => map[f] >= 0 ? r[map[f]] : '';
  const existing = new Set(db.tasks.map(timpKey)), seen = new Set(), out = [];
  rows.slice(headerIdx + 1).forEach(r => {
    if(!r || !r.some(c => String(c == null ? '' : c).trim())) return;
    const desc = String(get(r, 'description') == null ? '' : get(r, 'description')).trim();
    let title = cellTxt(get(r, 'title'));
    if(!title && desc) title = desc.split(/\r?\n/)[0].slice(0, 140);
    if(!title){ out.push({ invalid:true }); return; }
    const t = newTaskObj({
      title, clientName:cellTxt(get(r, 'clientName')), processNumber:cellTxt(get(r, 'processNumber')),
      dueDate:parseAnyDate(get(r, 'dueDate')), internalDate:parseAnyDate(get(r, 'internalDate')), startDate:parseAnyDate(get(r, 'startDate')),
      category:map.category >= 0 ? mapCategory(cellTxt(get(r, 'category')), defaults.category) : (mapCategory(title, null) || defaults.category), status:mapStatus(cellTxt(get(r, 'status')), defaults.status),
      priority:map.priority >= 0 ? mapPriority(cellTxt(get(r, 'priority'))) : 'medium',
      responsible:cellTxt(get(r, 'responsible')) || defaults.responsible, counterpart:cellTxt(get(r, 'counterpart')), court:cellTxt(get(r, 'court')),
      description:desc, nextStep:cellTxt(get(r, 'nextStep')),
      tags:cellTxt(get(r, 'tags')).split(/[,;]+/).map(x => x.trim()).filter(Boolean),
      observations:String(get(r, 'observations') == null ? '' : get(r, 'observations')).trim()

    if(t.status === 'completed') t.completedAt = t.dueDate ? new Date(t.dueDate + 'T12:00').toISOString() : new Date().toISOString();
    const k = timpKey(t); const dup = existing.has(k) || seen.has(k); seen.add(k);

  });

}

let confirmResolve = null;
function confirmDialog({ title, text, ok = 'Confirmar', danger = false }){
  return new Promise(res => {

    w.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="cf-t" aria-describedby="cf-d"><div class="modal-body"><h2 id="cf-t" class="modal-h">${esc(title)}</h2><p id="cf-d">${esc(text)}</p></div><div class="modal-foot"><button type="button" class="btn secondary" data-cf="0">Cancelar</button><button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-cf="1">${esc(ok)}</button></div></div>`;
    w.classList.add('open');

    const done = v => { w.classList.remove('open'); w.onclick = null; confirmResolve = null; if(prevFocus && document.contains(prevFocus) && prevFocus.focus) prevFocus.focus({ preventScroll:true }); res(v); };
    confirmResolve = done;

  const box = $('#toasts'); const el = document.createElement('div');
  el.className = 'toast ' + type; el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = `${ic(type === 'success' ? 'check-circle' : type === 'error' ? 'alert' : 'info')}<span class="toast-msg">${esc(msg)}</span>`;
  let timer; const dismiss = () => { clearTimeout(timer); el.classList.add('out'); setTimeout(() => el.remove(), 200); };
  if(opts.action){ const b = document.createElement('button'); b.type = 'button'; b.className = 'toast-action'; b.textContent = opts.action.label; b.onclick = () => { dismiss(); opts.action.fn(); }; el.appendChild(b); }
  const x = document.createElement('button'); x.type = 'button'; x.className = 'toast-x'; x.setAttribute('aria-label', 'Fechar aviso'); x.innerHTML = ic('x', 'i-sm'); x.onclick = dismiss; el.appendChild(x);
  box.appendChild(el); while(box.children.length > 3) box.firstElementChild.remove();
  timer = setTimeout(dismiss, opts.action ? 7000 : 3800);
  el.addEventListener('mouseenter', () => clearTimeout(timer));
  el.addEventListener('mouseleave', () => { timer = setTimeout(dismiss, 2500); });
}

/* =========================================================
   BUSCA GLOBAL
   ========================================================= */
const gs = $('#gsearch'), sp = $('#search-pop'); let spList = [], spIdx = -1;
function closeSearch(){ sp.classList.remove('open'); gs.setAttribute('aria-expanded', 'false'); gs.removeAttribute('aria-activedescendant'); spIdx = -1; }
function runSearch(){
  const q = gs.value.trim(); if(!q){ closeSearch(); return; }
  const ts = db.tasks.filter(t => matches(t, q)).sort((a, b) => (isOpen(b) - isOpen(a)) || byScore(a, b)).slice(0, 7);
  const cs = db.clients.filter(c => [c.name, c.doc, c.email, c.phone].some(x => norm(x).includes(norm(q)))).slice(0, 4);
  spList = [...ts.map(t => ({ k:'task', id:t.id })), ...cs.map(c => ({ k:'client', id:c.id })), { k:'all', q }];
  let i = 0; const row = html => `<button type="button" class="sp-item" role="option" id="sp-${i}" data-sp="${i++}">${html}</button>`;
  let h = '';
  if(ts.length) h += `<div class="sp-sec">Tarefas</div>` + ts.map(t => row(`${ic((CATS[t.category] || CATS.judicial).icon)}<span class="sp-txt"><span class="t ${isOpen(t) ? '' : 'struck'}">${esc(t.title)}</span><span class="s">${esc([t.clientName, t.processNumber].filter(Boolean).join(' · ') || (CATS[t.category] || CATS.judicial).label)}</span></span>${t.dueDate ? `<span class="s">${fmtDate(t.dueDate)}</span>` : ''}`)).join('');
  if(cs.length) h += `<div class="sp-sec">Clientes</div>` + cs.map(c => row(`${avatar(c.name)}<span class="sp-txt"><span class="t">${esc(c.name)}</span><span class="s">${esc(c.doc || c.email || c.phone || 'Cliente')}</span></span>`)).join('');
  if(!ts.length && !cs.length) h += `<div class="sp-empty">Nenhum resultado para “${esc(q)}”.</div>`;
  h += row(`${ic('search')}<span class="sp-txt"><span class="t">Ver todas as tarefas com “${esc(q)}”</span></span>`);
  sp.innerHTML = h; sp.classList.add('open'); gs.setAttribute('aria-expanded', 'true'); spIdx = -1;
}
function highlightSearch(){ $$('.sp-item', sp).forEach((b, j) => b.classList.toggle('active', j === spIdx)); if(spIdx >= 0){ gs.setAttribute('aria-activedescendant', 'sp-' + spIdx); const a = $('#sp-' + spIdx); if(a) a.scrollIntoView({ block:'nearest' }); } }
function pickSearch(i){
  const it = spList[i]; if(!it) return; closeSearch();
  if(it.k === 'task'){ gs.value = ''; openTask(it.id); }
  else if(it.k === 'client'){ gs.value = ''; openClient(it.id); }
  else { tf.q = it.q; tf.showDone = true; tf.status = ''; gs.value = ''; gs.blur(); go('tarefas'); }
}
gs.addEventListener('input', debounce(runSearch, 90));
gs.addEventListener('focus', () => { if(gs.value.trim()) runSearch(); });
gs.addEventListener('keydown', e => {
  if(!sp.classList.contains('open')) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); spIdx = Math.min(spList.length - 1, spIdx + 1); highlightSearch(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); spIdx = Math.max(0, spIdx - 1); highlightSearch(); }
  else if(e.key === 'Enter'){ e.preventDefault(); pickSearch(spIdx >= 0 ? spIdx : spList.length - 1); }
});

/* =========================================================
   BACKUP, IMPORTAÇÃO E AGENDA (.ics)
   ========================================================= */
function exportData(){
  db.meta.lastBackup = new Date().toISOString(); saveDB();
  download('lex_backup_' + todayISO() + '.json', JSON.stringify(db, null, 2), 'application/json');
  toast('Backup exportado. Guarde o arquivo em local seguro.', 'success'); refreshBackground();
}
function importData(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = async () => {
    let data; try{ data = JSON.parse(r.result); }catch(e){ toast('Arquivo inválido: não é um backup em JSON.', 'error'); return; }
    if(!data || !Array.isArray(data.tasks)){ toast('Arquivo inválido: não contém tarefas do Lex.', 'error'); return; }
    const ok = await confirmDialog({ title:'Restaurar backup?', text:`Serão carregadas ${data.tasks.length} tarefas, ${(data.clients || []).length} clientes e ${(data.events || []).length} compromissos. Os dados atuais deste navegador serão substituídos.`, ok:'Restaurar' });
    if(!ok) return;
    await closeDrawer(true); db = data; normalizeDB(); migrateClientsFromTasks(); saveDB(); await mirrorNow(); refresh();
    toast('Backup restaurado com sucesso', 'success');
  };
  r.onerror = () => toast('Não foi possível ler o arquivo.', 'error');
  r.readAsText(file);
}
async function clearAll(){
  const ok = await confirmDialog({ title:'Apagar todos os dados?', text:'Esta ação não pode ser desfeita. Recomendamos exportar um backup antes.', ok:'Apagar tudo', danger:true });
  if(!ok) return;
  await closeDrawer(true); db = {}; normalizeDB(); saveDB(); await mirrorNow(); refresh(); toast('Todos os dados foram apagados', 'info');
}
function icsEsc(s){ return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsFold(l){ const out = []; while(l.length > 60){ out.push(l.slice(0, 60)); l = ' ' + l.slice(60); } out.push(l); return out.join('\r\n'); }
function ymd(iso){ return iso.replace(/-/g, ''); }
function exportICS(){
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Lex//Gestao Juridica//PT-BR', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:Lex - Prazos e compromissos'];
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z'); let n = 0;
  db.events.filter(e => !e.done && e.date && daysLeft(e.date) >= -1).forEach(e => {
    L.push('BEGIN:VEVENT', 'UID:ev-' + e.id + '@lex', 'DTSTAMP:' + stamp);
    if(e.time){
      const st = new Date(e.date + 'T' + e.time), en = new Date(st.getTime() + 3600000);
      const f = d => ymd(isoDate(d)) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
      L.push('DTSTART:' + f(st), 'DTEND:' + f(en));
    } else L.push('DTSTART;VALUE=DATE:' + ymd(e.date), 'DTEND;VALUE=DATE:' + ymd(isoDate(addDays(parseISO(e.date), 1))));
    L.push('SUMMARY:' + icsEsc((EVT[e.type] || 'Compromisso') + ': ' + e.title));
    if(e.location) L.push('LOCATION:' + icsEsc(e.location));
    L.push('DESCRIPTION:' + icsEsc([e.clientName && 'Cliente: ' + e.clientName, e.notes].filter(Boolean).join('\n')));
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(e.title), 'TRIGGER:-PT1H', 'END:VALARM', 'END:VEVENT'); n++;
  });
  db.tasks.filter(t => isOpen(t) && t.dueDate && daysLeft(t.dueDate) >= -1).forEach(t => {
    L.push('BEGIN:VEVENT', 'UID:prazo-' + t.id + '@lex', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + ymd(t.dueDate), 'DTEND;VALUE=DATE:' + ymd(isoDate(addDays(parseISO(t.dueDate), 1))),
      'SUMMARY:' + icsEsc('PRAZO FATAL: ' + t.title),
      'DESCRIPTION:' + icsEsc([t.clientName && 'Cliente: ' + t.clientName, t.processNumber && 'Processo: ' + t.processNumber, t.nextStep && 'Próximo passo: ' + t.nextStep].filter(Boolean).join('\n')),
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc('Prazo fatal amanhã: ' + t.title), 'TRIGGER:-P1D', 'END:VALARM', 'END:VEVENT'); n++;
  });
  L.push('END:VCALENDAR');
  if(!n){ toast('Não há prazos ou compromissos futuros para exportar.', 'info'); return; }
  download('lex-agenda-' + todayISO() + '.ics', L.map(icsFold).join('\r\n'), 'text/calendar;charset=utf-8');
  toast(n + ' ' + plural(n, 'item exportado', 'itens exportados') + '. Importe o arquivo no Google Agenda ou Outlook.', 'success');
}

/* =========================================================
   MENU LATERAL (mobile), FOCO E ATALHOS
   ========================================================= */
function openSidebar(){ $('#sidebar').classList.add('open'); $('#sidebar-scrim').classList.add('open'); $('#menu-btn').setAttribute('aria-expanded', 'true'); const a = $('#sidebar .nav-item.active') || $('#sidebar .nav-item'); if(a) a.focus(); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#sidebar-scrim').classList.remove('open'); const b = $('#menu-btn'); if(b) b.setAttribute('aria-expanded', 'false'); }
function topLayer(){
  if($('#confirm-wrap').classList.contains('open')) return $('#confirm-wrap');
  if($('#modal-wrap').classList.contains('open')) return $('#modal');
  if(isDrawerOpen()) return drawer;
  if($('#sidebar').classList.contains('open')) return $('#sidebar');
  return null;
}
function trapFocus(e){
  const L = topLayer(); if(!L) return;
  const f = $$('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),summary,[tabindex]:not([tabindex="-1"])', L).filter(x => x.offsetParent !== null);
  if(!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if(!L.contains(document.activeElement)){ e.preventDefault(); first.focus(); return; }
  if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
}
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(confirmResolve){ confirmResolve(false); return; }
    if($('#modal-wrap').classList.contains('open')){ closeModal(); return; }
    if(sp.classList.contains('open')){ closeSearch(); gs.blur(); return; }
    if(isDrawerOpen()){ closeDrawer(); return; }
    if($('#sidebar').classList.contains('open')){ closeSidebar(); $('#menu-btn').focus(); return; }
    return;
  }
  if(e.key === 'Tab'){ trapFocus(e); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-open-task]')){ e.preventDefault(); openTask(e.target.dataset.openTask); return; }
  if(typing || e.metaKey || e.ctrlKey || e.altKey || topLayer()) return;
  if(e.key === 'n' || e.key === 'N'){ e.preventDefault(); openTask(null); }
  else if(e.key === '/'){ e.preventDefault(); gs.focus(); }
});

   DELEGAÇÃO DE EVENTOS
   ========================================================= */

  const q = s => e.target.closest(s); let el;
  if(!q('.search')) closeSearch();
  if((el = q('[data-toggle-done]'))){ e.preventDefault(); toggleDone(el.dataset.toggleDone); return; }
  if((el = q('[data-complete]'))){ e.preventDefault(); completeTask(el.dataset.complete); return; }
  if((el = q('[data-reopen]'))){ e.preventDefault(); reopenTask(el.dataset.reopen); return; }
  if((el = q('[data-ns-done]'))){ nextStepDone(el.dataset.nsDone); return; }
  if((el = q('[data-kpi]'))){ openKpi(el.dataset.kpi); return; }
  if((el = q('[data-quad-more]'))){ const k = el.dataset.quadMore; openListDrawer(QUAD[k].t, quadLists(tasksBase())[k]); return; }
  if((el = q('[data-open-event]'))){ openEvent(el.dataset.openEvent); return; }

  if((el = q('[data-client-name]'))){ openClientByName(el.dataset.clientName); return; }
  if((el = q('[data-new-client]'))){ openClient(null); return; }
  if((el = q('[data-import-clients]'))){ $('#clients-file').click(); return; }
  if((el = q('[data-import-tasks]'))){ $('#tasks-file').click(); return; }
  if((el = q('[data-export-tasks]'))){ exportTasksSheet(); return; }
  if((el = q('[data-task-template]'))){ downloadTaskTemplate(); return; }
  if((el = q('[data-snap-recover]'))){ recoverFromSnapshot(el.dataset.snapRecover); return; }
  if((el = q('[data-snap-download]'))){ downloadSnapshot(el.dataset.snapDownload); return; }
  if((el = q('[data-open-task]'))){ openTask(el.dataset.openTask); return; }
  if((el = q('[data-new-task]'))){ const c = el.dataset.newTask; openTask(null, CATS[c] ? { category:c } : {}); return; }
  if((el = q('[data-close-drawer]'))){ closeDrawer(); return; }
  if((el = q('[data-close-modal]'))){ closeModal(); return; }
  if((el = q('[data-go]'))){ go(el.dataset.go); return; }
  if((el = q('[data-go-day]'))){ const iso = el.dataset.goDay, d = parseISO(iso); ag.selected = iso; ag.month = new Date(d.getFullYear(), d.getMonth(), 1); go('agenda'); return; }
  if((el = q('[data-tview]'))){ tf.view = el.dataset.tview; saveUI(); renderTarefas(); const b = $(`[data-tview="${tf.view}"]`); if(b) b.focus(); return; }
  if((el = q('[data-tview-go]'))){ tf.view = el.dataset.tviewGo; saveUI(); go('tarefas'); return; }
  if((el = q('[data-cat-filter]'))){ const c = el.dataset.catFilter; go(c ? 'tarefas/' + c : 'tarefas'); return; }
  if((el = q('[data-group-toggle]'))){ const k = el.dataset.groupToggle; tf.collapsed[k] = !tf.collapsed[k]; saveUI(); const g = el.closest('.group'); g.classList.toggle('collapsed', !!tf.collapsed[k]); el.setAttribute('aria-expanded', String(!tf.collapsed[k])); return; }
  if((el = q('[data-clear-filters]'))){ tf.q = ''; tf.resp = ''; tf.status = ''; saveUI(); renderTarefas(); return; }
  if((el = q('[data-cal-day]'))){ ag.selected = el.dataset.calDay; const d = parseISO(ag.selected); if(d.getMonth() !== ag.month.getMonth() || d.getFullYear() !== ag.month.getFullYear()) ag.month = new Date(d.getFullYear(), d.getMonth(), 1); renderAgenda(); updateNav(); const b = $(`[data-cal-day="${ag.selected}"]`); if(b) b.focus(); return; }
  if((el = q('[data-cal-nav]'))){ const n = +el.dataset.calNav; if(n === 0){ const t = new Date(); ag.month = new Date(t.getFullYear(), t.getMonth(), 1); ag.selected = todayISO(); } else ag.month = new Date(ag.month.getFullYear(), ag.month.getMonth() + n, 1); renderAgenda(); const b = $(`[data-cal-nav="${n}"]`); if(b) b.focus(); return; }
  if((el = q('[data-ics]'))){ exportICS(); return; }
  if((el = q('[data-export]'))){ exportData(); return; }
  if((el = q('[data-import]'))){ $('#import-file').click(); return; }
  if((el = q('[data-snooze-backup]'))){ backupSnoozed = true; renderView(); return; }
  if((el = q('[data-theme-set]'))){ setTheme(el.dataset.themeSet); return; }
  if((el = q('#theme-btn'))){ setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'); return; }
  if((el = q('[data-clear-all]'))){ clearAll(); return; }
  if((el = q('[data-sp]'))){ pickSearch(+el.dataset.sp); return; }
  if((el = q('#menu-btn'))){ openSidebar(); return; }
  if((el = q('#sidebar-scrim'))){ closeSidebar(); return; }
  if((el = q('#drawer-scrim'))){ closeDrawer(); return; }
});
document.addEventListener('submit', e => { if(e.target.id === 'quick-form'){ e.preventDefault(); quickAdd(); } });
document.addEventListener('input', e => {
  const el = e.target;
  if(el.id === 't-search'){ tf.q = el.value; renderTasksBody(); }
  else if(el.id === 'c-search'){ cq = el.value; renderClientsBody(); }
});
function refocus(id){ const el = document.getElementById(id); if(el) el.focus(); }
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 't-status'){ tf.status = el.value; renderTarefas(); refocus('t-status'); }
  else if(el.id === 't-resp'){ tf.resp = el.value; saveUI(); renderTarefas(); refocus('t-resp'); }
  else if(el.id === 't-sort'){ tf.sort = el.value; saveUI(); renderTasksBody(); }
  else if(el.id === 't-done'){ tf.showDone = el.checked; renderTasksBody(); }
  else if(el.dataset && el.dataset.setting){ saveSetting(el); }
  else if(el.id === 'import-file'){ importData(el.files[0]); el.value = ''; }
  else if(el.id === 'clients-file'){ importClientsFile(el.files[0]); el.value = ''; }
  else if(el.id === 'tasks-file'){ importTasksFile(el.files[0]); el.value = ''; }
  else if(el.dataset && el.dataset.settingList){ saveSettingList(el); }
});
/* Arrastar e soltar no quadro */
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('[data-drag-id]'); if(!c) return; e.dataTransfer.setData('text/plain', c.dataset.dragId); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging'); });
document.addEventListener('dragend', () => { $$('.dragging').forEach(x => x.classList.remove('dragging')); $$('.drop-hover').forEach(x => x.classList.remove('drop-hover')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('[data-drop-status]'); if(!col) return; e.preventDefault(); e.dataTransfer.dropEffect = 'move'; $$('.drop-hover').forEach(x => { if(x !== col) x.classList.remove('drop-hover'); }); col.classList.add('drop-hover'); });
document.addEventListener('drop', e => { const col = e.target.closest && e.target.closest('[data-drop-status]'); if(!col) return; e.preventDefault(); col.classList.remove('drop-hover'); const id = e.dataTransfer.getData('text/plain'); if(id) setStatus(id, col.dataset.dropStatus); });

/* =========================================================
   INICIALIZAÇÃO

updateSaveState();
applyTheme();
route = parseHash(); applyRouteParams();

render();
window.addEventListener('hashchange', () => {
  if(isDrawerOpen() && drawerMode !== 'task') closeDrawer(true);

if(window.matchMedia){ const mq = matchMedia('(prefers-color-scheme: dark)'); const onMq = () => { if(getThemePref() === 'system'){ applyTheme(); if(route.view === 'indicadores') renderView(); } }; if(mq.addEventListener) mq.addEventListener('change', onMq); else if(mq.addListener) mq.addListener(onMq); }
/* Mantém várias abas sincronizadas */
window.addEventListener('storage', e => {

/* Recupera dados da cópia de segurança se o armazenamento foi apagado ou sobrescrito */
reconcileWithMirror();
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden' && mirrorT) mirrorNow(); });
window.addEventListener('pagehide', () => { if(mirrorT) mirrorNow(); });
/* Virada do dia com a página aberta */
let lastDay = todayISO();
setInterval(() => { const t = todayISO(); if(t !== lastDay){ lastDay = t; ag.selected = t; refresh(); } }, 60000);
